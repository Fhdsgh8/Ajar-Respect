<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أذكار المسلم | AJAR RESPECT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Reem+Kufi:wght@400;700&display=swap');
        body { background: #05040a; color: white; font-family: 'Reem Kufi'; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .zkr-card { background: rgba(20,15,35,0.7); border: 1px solid rgba(197,160,89,0.2); padding: 30px; margin-bottom: 20px; border-radius: 5px; text-align: center; cursor: pointer; transition: 0.3s; }
        .zkr-card:active { transform: scale(0.98); background: rgba(197,160,89,0.1); }
        .text { font-family: 'Amiri'; font-size: 24px; color: #f3cf8a; line-height: 1.8; }
        .count-badge { display: inline-block; margin-top: 15px; padding: 5px 20px; background: #c5a059; color: #000; border-radius: 50px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align:center; color:#c5a059; font-family:'Amiri'; font-size:40px;">أذكار الصباح والمساء</h1>
        <div class="zkr-card" onclick="updateCount(this, 3)">
            <p class="text">"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لا إِلَهَ إِلا اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ"</p>
            <div class="count-badge">التكرار: <span class="num">3</span></div>
        </div>
        </div>
    <script>
        function updateCount(el, max) {
            let span = el.querySelector('.num');
            let current = parseInt(span.innerText);
            if(current > 0) {
                span.innerText = current - 1;
                if(current - 1 === 0) el.style.opacity = "0.3";
            }
        }
    </script>
</body>
</html>
