<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موسوعة الأنبياء | Ajar Respect</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap');
        :root { --bg: #05040a; --gold: #c5a059; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 20px; line-height: 1.8; }
        .container { max-width: 900px; margin: auto; }
        select { width: 100%; padding: 15px; background: rgba(26,20,45,0.8); color: var(--gold); border: 1px solid var(--gold); font-size: 18px; margin-bottom: 20px; }
        .story-display { background: rgba(26,20,45,0.6); padding: 35px; border: 1px solid rgba(197,160,89,0.2); backdrop-filter: blur(10px); text-align: justify; }
        h2 { color: var(--gold); font-family: 'Amiri'; font-size: 32px; border-bottom: 1px solid var(--gold); }
        .highlight { color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" style="color: var(--gold); text-decoration: none; display: block; text-align: center; margin-bottom: 20px;">← العودة للرئيسية</a>
        <h1 style="text-align: center; color: var(--gold); font-family: 'Amiri'; font-size: 40px;">موسوعة قصص الأنبياء</h1>
        <select id="prophetSelect" onchange="updateStory()">
            <option value="">-- اختر نبي الله لقراءة قصته --</option>
            <option value="adam">آدم عليه السلام</option>
            <option value="noah">نوح عليه السلام</option>
        </select>
        <div id="storyContent" class="story-display"><p style="text-align: center; color: #888;">اختر من القائمة أعلاه...</p></div>
    </div>
    <script>
        const stories = {
            adam: `<h2>آدم عليه السلام</h2><p><span class="highlight">الخلق:</span> خلق الله آدم من طين ونفخ فيه من روحه..</p>`,
            noah: `<h2>نوح عليه السلام</h2><p><span class="highlight">الدعوة:</span> لبث في قومه 950 سنة يدعوهم للتوحيد..</p>`
        };
        function updateStory() {
            const val = document.getElementById('prophetSelect').value;
            if (stories[val]) document.getElementById('storyContent').innerHTML = stories[val];
        }
    </script>
</body>
</html>
