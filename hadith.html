<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الأحاديث الشريفة | AJAR RESPECT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap');
        body { background: #05040a; color: #ccc; font-family: 'serif'; padding: 40px; text-align: center; }
        .hadith-box { max-width: 800px; margin: auto; padding: 40px; border: 1px solid #c5a059; position: relative; background: rgba(10,10,10,0.5); }
        .hadith-box::after { content: '📜'; position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 40px; background: #05040a; padding: 0 10px; }
        h2 { font-family: 'Amiri'; color: #f3cf8a; font-size: 30px; }
        .narrator { color: #c5a059; font-style: italic; }
    </style>
</head>
<body>
    <div class="hadith-box">
        <p class="narrator">عن أبي هريرة رضي الله عنه قال:</p>
        <h2>"مَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ"</h2>
        <p style="font-size: 14px; opacity: 0.6;">رواه البخاري ومسلم</p>
    </div>
</body>
</html>
