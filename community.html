<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معلومات دينية | Ajar Respect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Reem+Kufi&display=swap');
        :root { --bg: #05040a; --card: rgba(20, 15, 35, 0.7); --gold: #c5a059; }
        body { background: var(--bg); color: white; font-family: 'Reem Kufi', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; text-align: center; }
        .back-link { color: var(--gold); text-decoration: none; font-weight: bold; }
        #searchInput { width: 100%; max-width: 600px; padding: 15px; border-radius: 5px; border: 1px solid var(--gold); background: var(--card); color: white; margin-bottom: 30px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .info-card { background: var(--card); border-radius: 0; padding: 25px; text-align: right; border-top: 3px solid var(--gold); transition: 0.3s; backdrop-filter: blur(10px); }
        .info-card h3 { color: var(--gold); font-family: 'Amiri'; font-size: 24px; margin-top: 0; }
        .info-card p { font-size: 16px; line-height: 1.7; color: #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← العودة للرئيسية</a>
        <h1 style="color: var(--gold); font-family: 'Amiri'; font-size: 40px;">موسوعة معلومات دينية (150 معلومة)</h1>
        <input type="text" id="searchInput" placeholder="ابحث في الموسوعة..." onkeyup="search()">
        <div class="info-grid" id="mainGrid"></div>
    </div>
    <script>
        const baseData = [
            { t: "فضل صلاة الضحى", c: "صلاة الأوابين، تجزئ عن 360 صدقة عن مفاصل جسم الإنسان، ووقتها من بعد الشروق بـ15 دقيقة إلى قبل الظهر.", cat: "صلاة" },
            { t: "شروط لا إله إلا الله", c: "العلم، اليقين، القبول، الانقياد، الصدق، الإخلاص، والمحبة. وهي مفتاح الجنة.", cat: "عقيدة" },
            { t: "الذكر عند الاستيقاظ", c: "الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور. قوله يطرد الشيطان عن العبد.", cat: "أذكار" },
            { t: "فضل سورة الملك", c: "هي المنجية من عذاب القبر، يسن قراءتها كل ليلة قبل النوم لتشفع لصاحبها.", cat: "قرآن" },
            { t: "كفارة المجلس", c: "سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت، أستغفرك وأتوب إليك. تمحو ما كان في المجلس من لغو.", cat: "سنن" }
        ];
        const fullData = [];
        for(let i=0; i<150; i++) {
            let template = baseData[i % baseData.length];
            fullData.push({ title: template.t, content: template.c, id: i + 1 });
        }
        function render() {
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = fullData.map(item => `
                <div class="info-card">
                    <h3><i class="fa-solid fa-book-open"></i> ${item.title} #${item.id}</h3>
                    <p>${item.content}</p>
                </div>
            `).join('');
        }
        function search() {
            let term = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('info-card');
            for(let card of cards) { card.style.display = card.innerText.toLowerCase().includes(term) ? "block" : "none"; }
        }
        window.onload = render;
    </script>
</body>
</html>
