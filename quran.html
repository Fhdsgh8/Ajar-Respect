<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم | AJAR RESPECT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Reem+Kufi&display=swap');
        
        :root { --bg: #05040a; --gold: #c5a059; }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Reem Kufi', sans-serif; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; /* لمنع التمرير المزدوج */
        }

        .quran-header {
            background: rgba(17, 12, 34, 0.95);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .quran-header h1 { font-family: 'Amiri'; color: var(--gold); margin: 0; font-size: 24px; }
        .back-btn { color: var(--gold); text-decoration: none; font-size: 18px; }

        /* حاوية عرض المصحف */
        .quran-frame-container {
            width: 100%;
            height: calc(100vh - 70px); /* طرح طول الهيدر */
            background: #fff; /* خلفية بيضاء لورق المصحف */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-overlay {
            position: absolute;
            top: 70px; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .loader {
            border: 4px solid #1a1432;
            border-top: 4px solid var(--gold);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="quran-header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> عودة</a>
        <h1>القرآن الكريم</h1>
        <div style="width: 30px;"></div> </div>

    <div class="loading-overlay" id="loader">
        <div class="loader"></div>
        <p style="margin-top: 15px; color: var(--gold);">جاري فتح المصحف الشريف...</p>
    </div>

    <div class="quran-frame-container">
        <iframe 
            src="https://quran.ksu.edu.sa/m.php" 
            onload="document.getElementById('loader').style.display='none';">
        </iframe>
    </div>

</body>
</html>
