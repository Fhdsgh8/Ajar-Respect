<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم بالكامل | Ajar Respect</title>
    <style>
        /* ضبط الخلفية لتكون متناسقة مع الواجهة الرمضانية */
        body, html { 
            background-color: #05040a; 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        
        /* تعديل الهيدر ليصبح باللون الذهبي والأسود الفخم كما طلبت */
        .header-nav {
            background: #0a0a14;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #c5a059; /* تغيير البنفسجي لذهبي */
        }
        
        .header-nav a {
            color: #c5a059; /* تغيير لون الخط لذهبي */
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            transition: 0.3s;
        }

        .header-nav a:hover {
            opacity: 0.8;
            text-shadow: 0 0 10px rgba(197, 160, 89, 0.5);
        }

        /* ضبط الإطار */
        iframe {
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
            background: #05040a;
        }
    </style>
</head>
<body>
    <div class="header-nav">
        <a href="index.html">← العودة للرئيسية - Ajar Respect</a>
    </div>

    <iframe src="https://quran.com/ar" title="القرآن الكريم بالعربية"></iframe>
</body>
</html>
