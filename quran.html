<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم | AJAR RESPECT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400;700&display=swap');

        :root {
            --gold: #c5a059;
            --bg: #05040a;
            --purple-dark: #1b1435;
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Amiri', serif;
            margin: 0;
            line-height: 2.5;
        }

        /* هيدر الصفحة */
        header {
            background: linear-gradient(to bottom, var(--purple-dark), var(--bg));
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid var(--gold);
        }

        .title {
            font-size: 50px;
            color: var(--gold);
            margin: 0;
            text-shadow: 0 0 15px rgba(197, 160, 89, 0.3);
        }

        /* نظام عرض السور */
        .quran-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        .surah-header {
            text-align: center;
            border-bottom: 2px double var(--gold);
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        .bismillah {
            font-size: 35px;
            color: var(--gold);
            display: block;
            margin: 20px 0;
        }

        /* تنسيق الآيات */
        .aya {
            font-size: 28px;
            cursor: pointer;
            transition: 0.3s;
            display: inline;
            padding: 2px 5px;
            border-radius: 5px;
        }

        .aya:hover {
            background: rgba(197, 160, 89, 0.1);
            color: var(--gold);
        }

        .aya-num {
            font-family: 'Reem Kufi', sans-serif;
            color: var(--gold);
            font-size: 18px;
            margin: 0 5px;
            border: 1px solid var(--gold);
            border-radius: 50%;
            padding: 2px 8px;
        }

        /* نافذة التفسير (Popup) */
        .tafseer-box {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: var(--purple-dark);
            border-top: 3px solid var(--gold);
            padding: 30px;
            transition: 0.5s;
            z-index: 1000;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }

        .tafseer-box.active {
            bottom: 0;
        }

        .tafseer-content {
            max-width: 800px;
            margin: auto;
            text-align: center;
        }

        .close-tafseer {
            position: absolute;
            top: 10px;
            left: 20px;
            color: var(--gold);
            cursor: pointer;
            font-size: 25px;
        }

        /* زر العودة للرئيسية */
        .back-home {
            position: fixed;
            top: 20px;
            right: 20px;
            color: var(--gold);
            text-decoration: none;
            font-family: 'Reem Kufi', sans-serif;
            font-size: 16px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a>

    <header>
        <h1 class="title">القرآن الكريم</h1>
        <p style="color: #aaa; font-family: 'Reem Kufi';">تلاوة وتدبر بآيات الله العظيمة</p>
    </header>

    <div class="quran-container">
        <div class="surah-header">
            <h2 style="color: var(--gold);">سورة الفاتحة</h2>
            <span class="bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</span>
        </div>

        <div class="quran-text" id="quranContent">
            <span class="aya" onclick="showTafseer('الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ', 'الشكر لله وحده خالق الخلق ومالك أمرهم.')">
                الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ <span class="aya-num">١</span>
            </span>
            <span class="aya" onclick="showTafseer('الرَّحْمَنِ الرَّحِيمِ', 'أي: ذو الرحمة الواسعة التي شملت جميع الخلائق.')">
                الرَّحْمَنِ الرَّحِيمِ <span class="aya-num">٢</span>
            </span>
            <span class="aya" onclick="showTafseer('مَالِكِ يَوْمِ الدِّينِ', 'وهو سبحانه وحده مالك يوم الجزاء والحساب.')">
                مَالِكِ يَوْمِ الدِّينِ <span class="aya-num">٣</span>
            </span>
            </div>
    </div>

    <div class="tafseer-box" id="tafseerBox">
        <span class="close-tafseer" onclick="hideTafseer()">&times;</span>
        <div class="tafseer-content">
            <h3 id="ayaText" style="color: var(--gold); margin-bottom: 15px;"></h3>
            <p id="tafseerText" style="font-size: 20px; line-height: 1.8;"></p>
        </div>
    </div>

    <script>
        function showTafseer(aya, tafseer) {
            document.getElementById('ayaText').innerText = aya;
            document.getElementById('tafseerText').innerText = tafseer;
            document.getElementById('tafseerBox').classList.add('active');
        }

        function hideTafseer() {
            document.getElementById('tafseerBox').classList.remove('active');
        }
    </script>

</body>
</html>
