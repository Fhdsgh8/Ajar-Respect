<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسماء الله الحسنى | Ajar Respect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Reem+Kufi:wght@400;700&display=swap');
        
        :root { --bg: #05040a; --gold: #c5a059; --card: rgba(20, 15, 35, 0.9); }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Reem Kufi', sans-serif; 
            margin: 0; padding: 20px;
        }

        .header { text-align: center; padding: 40px 0; }
        .header h1 { font-family: 'Amiri'; color: var(--gold); font-size: 45px; margin: 0; }
        .back-link { color: var(--gold); text-decoration: none; position: absolute; top: 20px; right: 20px; font-size: 18px; }

        .names-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .name-card {
            background: var(--card);
            border: 1px solid rgba(197, 160, 89, 0.1);
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            transition: 0.5s all ease;
            cursor: default;
        }

        /* تأثير التوهج الذهبي عند المرور أو اللمس */
        .name-card:hover {
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(197, 160, 89, 0.4);
            transform: translateY(-5px);
        }

        .name-card h2 { 
            font-family: 'Amiri'; 
            color: var(--gold); 
            font-size: 38px; 
            margin: 0 0 15px 0; 
            text-shadow: 0 0 10px rgba(197, 160, 89, 0.2);
        }

        .meaning { color: #eee; line-height: 1.6; font-size: 16px; margin-bottom: 15px; }
        .devotion { color: var(--gold); font-size: 14px; opacity: 0.8; border-top: 1px solid rgba(197, 160, 89, 0.1); padding-top: 10px; }

        /* لضمان فخامة العرض في الجوال */
        @media (max-width: 600px) {
            .names-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-right"></i> عودة</a>

    <div class="header">
        <h1>💎 أسماء الله الحسنى</h1>
        <p>معاني الجلال وطريق التعبد</p>
    </div>

    <div class="names-grid" id="namesList">
        </div>

    <script>
        const namesData = [
            {n: "الرحمن", m: "واسع الرحمة الذي وسعت رحمته كل شيء، المؤمن والكافر.", d: "ارحم من في الأرض يرحمك من في السماء."},
            {n: "الرحيم", m: "الموصوف بالرحمة الواصلة لعباده المؤمنين خاصة.", d: "الثقة برحمة الله وتدبر لطفه في أدق تفاصيل حياتك."},
            {n: "الملك", m: "صاحب السلطان المطلق، المتصرف في الأكوان بلا منازع.", d: "الخضوع لعظمته وعدم الخوف من سلطان البشر."},
            {n: "القدوس", m: "المنزه عن كل نقص، والطاهر من كل عيب.", d: "تطهير القلب من الغل والحسد، واللسان من الفحش."},
            {n: "السلام", m: "ناشر السلام بين الأنام، ومانح الأمان لعباده.", d: "إفشاء السلام بين الناس، وطلب سلامة الصدر."},
            {n: "المؤمن", m: "الذي صدق عباده وعوده، ووهبهم الأمن من عذابه.", d: "الصدق في الأقوال والأفعال، وبث الطمأنينة فيمن حولك."},
            {n: "المهيمن", m: "المطلع على خفايا الأمور، والحافظ لكل شيء.", d: "استشعار مراقبة الله في السر والعلن."},
            {n: "العزيز", m: "الغالب الذي لا يغلب، وصاحب العزة والجبروت.", d: "الاعتزاز بالإسلام، وعدم الذل لغير الله."},
            {n: "الجبار", m: "الذي يجبر كسر القلوب، ويقهر العتاة بظلمهم.", d: "طلب الجبر من الله عند الانكسار، والابتعاد عن الكبر."},
            {n: "المتكبر", m: "الذي له الكبرياء والعظمة فوق كل خلقه.", d: "التواضع التام للخالق، فالعظمة رداؤه سبحانه."},
            {n: "الخالق", m: "الذي أوجد الأشياء من العدم على غير مثال سابق.", d: "التفكر في عجائب صنع الله في الأنفس والآفاق."},
            {n: "البارئ", m: "الذي خلق الخلق بتقدير واتساق بلا تفاوت.", d: "التعبد بموافقة الفطرة التي فطر الله الناس عليها."},
            {n: "المصور", m: "الذي أعطى كل مخلوق صورته الخاصة وهيئته.", d: "عدم السخرية من خلقه الله، وتدبر جمال التكوين."},
            {n: "الغفار", m: "الذي يستر الذنوب مهما كبرت، ويحلم على العاصي.", d: "كثرة الاستغفار، والستر على عيوب الناس."},
            {n: "القهار", m: "الذي خضعت له الرقاب، وذلت له الصعاب.", d: "قهر هوى النفس والشيطان لطاعة الله."},
            {n: "الوهاب", m: "كثير العطاء بلا مقابل، ومانح النعم بلا سؤال.", d: "شكر المنعم، والجود بما رزقك الله على المحتاجين."},
            {n: "الرزاق", m: "الذي يوصل الأرزاق لجميع الخلائق دون استثناء.", d: "القناعة، واليقين بأن رزقك لن يأخذه غيرك."},
            {n: "الفتاح", m: "الذي يفتح أبواب الرحمة، ويفصل بين الخصوم.", d: "طلب الفتح من الله في العلم والعمل وباب الرزق."},
            {n: "العليم", m: "الذي أحاط بكل شيء علماً، ظاهره وباطنه.", d: "طلب العلم النافع، والحياء من نظر الله إليك."},
            {n: "القابض الباسط", m: "يضيق الرزق لحكمة، ويوسعه بفضله ورحمته.", d: "الصبر عند الضيق، والشكر عند الرخاء."},
            {n: "الخافض الرافع", m: "يخفض المتكبرين، ويرفع المتقين والمؤمنين.", d: "التواضع ليرفعك الله، والحذر من معصيته لئلا يحط قدرك."},
            {n: "المعز المذل", m: "يهب العزة لمن أطاعه، ويذل من عصاه واتبع هواه.", d: "طلب العزة بطاعة الله وحده."},
            {n: "السميع", m: "الذي يسمع السر والنجوى، ولا يشغله سمع عن سمع.", d: "حفظ اللسان من اللغو، فالله يسمع كل كلمة."},
            {n: "البصير", m: "الذي يرى دبيب النملة السوداء في الليلة الظلماء.", d: "الإحسان في العبادة؛ كأنك تراه، فإنه يراك."},
            {n: "الحكم", m: "القاضي بالعدل، الذي لا يرد قضاؤه ولا حكمه.", d: "الرضا بقدر الله، والتحاكم لشرعه."},
            {n: "العدل", m: "المنزه عن الظلم، الذي يعطي كل ذي حق حقه.", d: "إقامة العدل في نفسك وأهلك ومع الناس."},
            {n: "اللطيف", m: "البر بعباده، الذي يوصل إليهم مصالحهم برفق.", d: "الرفق بالناس، واليقين بلطف الله في المصائب."},
            {n: "الخبير", m: "العالم ببواطن الأمور وخفايا الصدور.", d: "تطهير الباطن كما تطهر الظاهر."},
            {n: "الحليم", m: "الذي لا يعجل بالعقوبة، ويحلم على عباده.", d: "الحلم عند الغضب، والترفع عن السفه."},
            {n: "العظيم", m: "الذي له العظمة والكمال في ذاته وصفاته.", d: "تعظيم شعائر الله في القلب والجوارح."},
            {n: "الغفور", m: "الذي يمحو الذنب ويستر القبيح.", d: "عدم اليأس من روح الله مهما كثرت الذنوب."},
            {n: "الشكور", m: "الذي يعطي الكثير على العمل القليل.", d: "الإخلاص في العمل، وانتظار الأجر من الله وحده."},
            {n: "العلي", m: "الذي له العلو المطلق، علو الذات والقدر والقهر.", d: "تعظيم الله، والتواضع لعظمته."},
            {n: "الكبير", m: "الذي كل شيء دونه صغير، لعظمته وكبريائه.", d: "استحضار 'الله أكبر' في كل أحوالك."},
            {n: "الحفيظ", m: "الذي يحفظ أعمال العباد، ويحفظ أولياءه.", d: "احفظ الله يحفظك، في جوارحك ودينك."},
            {n: "المقيت", m: "القدير، المقتدر، الحفيظ، وموصل القوت.", d: "التوكل على الله في طلب القوت المادي والمعنوي."},
            {n: "الحسيب", m: "الكافي لعباده، والمحاسب لهم يوم القيامة.", d: "قول 'حسبي الله ونعم الوكيل' عند الشدائد."},
            {n: "الجليل", m: "المتصف بصفات الجلال والكمال والجمال.", d: "إجلال الله، وتقدير عظمته في قلبك."},
            {n: "الكريم", m: "الذي يعطي بلا سؤال، ويسامح بلا معاتبة.", d: "التحلي بصفة الكرم، وحسن الظن بالله."},
            {n: "الرقيب", m: "المطلع على ما في الضمائر، والحافظ للأعمال.", d: "دوام المراقبة لله في الخلوات."},
            {n: "المجيب", m: "الذي يقابل الدعاء بالعطاء، والسؤال بالإجابة.", d: "الإلحاح في الدعاء مع اليقين بالإجابة."},
            {n: "الواسع", m: "الذي وسع كل شيء رحمة وعلماً ورزقاً.", d: "سعة الصدر، واليقين بأن فضل الله واسع."},
            {n: "الحكيم", m: "الذي يضع الأشياء في مواضعها الصحيحة.", d: "الرضا بأقدار الله، فكله خير وإن خفي معناه."},
            {n: "الودود", m: "الذي يتودد لأوليائه بالمغفرة والنعم.", d: "محبة الله، والتودد للناس بالخلق الحسن."},
            {n: "المجيد", m: "المنتهي إليه الشرف، الواسع الكرم والجلال.", d: "تمجيد الله وتسبيحه في كل وقت."},
            {n: "الباعث", m: "الذي يبعث الموتى من القبور، ويبعث الرسل.", d: "الاستعداد ليوم البعث بالعمل الصالح."},
            {n: "الشهيد", m: "المطلع على كل شيء، الذي لا يغيب عنه شيء.", d: "الصدق في الشهادة، والعلم بأن الله شاهد عليك."},
            {n: "الحق", m: "الموجود حقاً، الذي لا شك في وجوده ولا ألوهيته.", d: "اتباع الحق، والدفاع عنه، والبعد عن الباطل."},
            {n: "الوكيل", m: "الذي يتولى أمور عباده، ويقوم بمصالحهم.", d: "تفويض الأمر لله بعد بذل الأسباب."},
            {n: "القوي المتين", m: "صاحب القدرة الكاملة التي لا يعتريها وهن.", d: "الاستقواء بالله عند الضعف."},
            {n: "الولي", m: "الناصر والمحب لأوليائه المؤمنين.", d: "موالاة أولياء الله، ومعاداة أعدائه."},
            {n: "الحميد", m: "المستحق للحمد والثناء لذاته وصفاته.", d: "دوام الحمد لله على كل حال."},
            {n: "المحصي", m: "الذي أحصى كل شيء عدداً وعالماً.", d: "محاسبة النفس قبل أن يحاسبها الله."},
            {n: "المبدئ المعيد", m: "الذي بدأ الخلق، والذي يعيده بعد الفناء.", d: "اليقين بالمعاد والحساب."},
            {n: "المحيي المميت", m: "واهب الحياة، ومقدر الموت على الخلائق.", d: "عمارة الأرض بالخير، والاستعداد للموت."},
            {n: "الحي القيوم", m: "الحي الذي لا يموت، القائم بشؤون خلقه.", d: "طلب العون منه (يا حي يا قيوم برحمتك أستغيث)."},
            {n: "الواجد الماجد", m: "الذي لا يعوزه شيء، ذو الشرف العظيم.", d: "الغنى بالله عمن سواه."},
            {n: "الواحد الأحد", m: "المنفرد بذاته وصفاته، الذي لا شريك له.", d: "إخلاص التوحيد لله وحده."},
            {n: "الصمد", m: "الذي تصمد إليه الخلائق في حاجاتها.", d: "قطع الرجاء في البشر، واللجوء للصمد."},
            {n: "القادر المقتدر", m: "الذي لا يعجزه شيء، وصاحب القدرة المطلقة.", d: "الاستعانة بقدرة الله على نوائب الدهر."},
            {n: "المقدم المؤخر", m: "يقدم من يشاء بفضله، ويؤخر من يشاء بعدله.", d: "المسارعة للخيرات ليكون لك التقديم عند الله."},
            {n: "الأول الآخر", m: "الذي ليس قبله شيء، والذي ليس بعده شيء.", d: "ليكن الله أول اهتماماتك، وآخر غاياتك."},
            {n: "الظاهر الباطن", m: "الظاهر بآياته، الباطن الذي لا تدركه الأبصار.", d: "تعظيم الله بالنظر في خلقه، وعبادته في السر."},
            {n: "الوالي", m: "المتصرّف في كل شيء بمشيئته وحكمته.", d: "الرضا بتدبير الله في شؤون حياتك."},
            {n: "المتعالي", m: "المنزه عن صفات المخلوقين، والعالي قدراً.", d: "تنزيه الله عن كل ما لا يليق بجلاله."},
            {n: "البر", m: "المحسن لعياده، الواسع العطاء واللطف.", d: "البر بالوالدين والناس اقتداءً بفضل الله."},
            {n: "التواب", m: "الذي يقبل توبة عباده المرة بعد المرة.", d: "تجديد التوبة دائماً، وقبول عذر المعتذرين."},
            {n: "المنتقم", m: "الذي يذل العصاة المستكبرين بعد الإعذار.", d: "الخوف من غضب الله، وعدم الظلم."},
            {n: "العفو", m: "الذي يمحو السيئات ويترك المؤاخذة عليها.", d: "اعفُ عمن ظلمك، ليعفو الله عنك."},
            {n: "الرؤوف", m: "شديد الرحمة، والرأفة هي منتهى الرحمة.", d: "الرأفة بالضعفاء والمساكين والأيتام."},
            {n: "مالك الملك", m: "المتصرف في ملكه كما يشاء، لا راد لأمره.", d: "التسليم لله في كل ما ملكك إياه."},
            {n: "ذو الجلال والإكرام", m: "المستحق للتعظيم، والواسع الفضل والكرم.", d: "إجلال الله، وكثرة الثناء عليه بهذا الاسم."},
            {n: "المقسط", m: "العادل في حكمه، المنصف للمظلوم.", d: "الإنصاف من النفس، والعدل مع الآخرين."},
            {n: "الجامع", m: "الذي يجمع الخلائق ليوم لا ريب فيه.", d: "العمل ليوم الجمع، وجمع القلوب على الطاعة."},
            {n: "الغني المغني", m: "المستغني عن خلقه، وواهب الغنى لمن يشاء.", d: "الاستغناء بالله، وسؤاله من فضله."},
            {n: "المانع", m: "الذي يمنع العطاء عن من يشاء لحكمة.", d: "الصبر عند المنع، فمنعه عطاء مبطن."},
            {n: "الضار النافع", m: "المقدر للضر والنفع، فلا نافع ولا ضار سواه.", d: "لا ترجُ نفعاً ولا تخشَ ضراً إلا من الله."},
            {n: "النور", m: "هادي أهل السماوات والأرض، ومنور القلوب.", d: "طلب نور الهداية، والبعد عن ظلمات المعاصي."},
            {n: "الهادي", m: "الذي يهدي القلوب للحق، ويرشد الخلائق.", d: "طلب الهداية دائماً (اهدنا الصراط المستقيم)."},
            {n: "البديع", m: "الذي خلق الخلق على غير مثال، في غاية الجمال.", d: "الإبداع في العمل، والتأمل في جمال الكون."},
            {n: "الباقي", m: "الدائم الذي لا يلحقه فناء ولا زوال.", d: "التعلق بالباقي، والزهد في الفاني."},
            {n: "الوارث", m: "الذي يبقى بعد فناء خلقه، وإليه المرجع.", d: "تذكر أن المال والجاه عارية سترد للوارث."},
            {n: "الرشيد", m: "الذي يرشد الخلق لمصالحهم، وأفعاله سديدة.", d: "سؤال الله الرشد في الأقوال والأفعال."},
            {n: "الصبور", m: "الذي لا يعجل بالعقوبة صبراً على عباده.", d: "التحلي بالصبر عند البلاء وعن المعصية."}
        ];

        const list = document.getElementById('namesList');
        namesData.forEach(item => {
            list.innerHTML += `
                <div class="name-card">
                    <h2>${item.n}</h2>
                    <div class="meaning">${item.m}</div>
                    <div class="devotion"><b>كيف تتعبد به:</b> ${item.d}</div>
                </div>
            `;
        });
    </script>
</body>
</html>
