<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فقه الصائم الشامل | Ajar Respect</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Reem+Kufi&display=swap');
        :root { --bg: #05040a; --gold: #c5a059; --card: rgba(26, 20, 45, 0.8); }
        body { background: var(--bg); color: white; font-family: 'Reem Kufi', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .header { text-align: center; padding: 40px 0; border-bottom: 2px double var(--gold); margin-bottom: 30px; }
        .header h1 { font-family: 'Amiri'; color: var(--gold); font-size: 45px; margin: 0; }
        
        .fiqh-section { margin-bottom: 40px; }
        .section-title { color: var(--gold); font-family: 'Amiri'; font-size: 30px; border-right: 4px solid var(--gold); padding-right: 15px; margin-bottom: 20px; }
        
        .item { background: var(--card); border: 1px solid rgba(197, 160, 89, 0.2); margin-bottom: 10px; cursor: pointer; transition: 0.3s; }
        .item:hover { border-color: var(--gold); }
        .q { padding: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .a { padding: 0 20px; max-height: 0; overflow: hidden; transition: 0.4s ease-out; color: #ccc; line-height: 1.8; font-size: 17px; }
        .item.active .a { padding: 20px; max-height: 500px; border-top: 1px solid rgba(197, 160, 89, 0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>⚖️ موسوعة فقه الصائم</h1><p>50 فتوى شاملة لكل أحكام الصيام</p></div>

        <div class="fiqh-section" id="fatawaContainer">
            </div>
    </div>

    <script>
        const fatawa = [
            {q: "هل بخاخ الربو يفطر؟", a: "الأرجح أنه لا يفطر؛ لأنه غاز يذهب للمجاري التنفسية وليس للعدة."},
            {q: "حكم استخدام قطرة العين والأذن؟", a: "لا تفطر وإن وجد طعمها في الحلق؛ لأن العين والأذن ليستا منفذاً للمعدة."},
            {q: "هل التبرد بالماء يفسد الصوم؟", a: "لا يفسد الصوم، وللصائم أن يغتسل أو يبل ثوبه لتخفيف الحرارة."},
            {q: "حكم بلع الريق للصائم؟", a: "لا بأس به ولا يفطر بإجماع العلماء لأنه مما يشق التحرز منه."},
            {q: "ما حكم من أكل أو شرب ناسياً؟", a: "صيامه صحيح ولا قضاء عليه، لقوله ﷺ: (فإنما أطعمه الله وسقاه)."},
            {q: "هل معجون الأسنان يفطر؟", a: "لا يفطر ما لم ينزل منه شيء إلى الجوف، والأفضل استخدامه قبل السحر."},
            {q: "حكم تذوق الطعام للمرأة؟", a: "يجوز للحاجة بشرط ألا يصل شيء منه إلى جوفها."},
            {q: "هل القيء غير المتعمد يبطل الصوم؟", a: "لا يبطل، أما من استقاء عمداً فقد أفطر وعليه القضاء."},
            {q: "حكم استخدام الإبر العلاجية (غير المغذية)؟", a: "لا تفطر، سواء كانت في العضل أو الوريد، لأنها ليست أكلاً ولا شرباً."},
            {q: "هل خروج دم الجروح يبطل الصوم؟", a: "لا يبطل الصوم خروج الدم من الجروح أو سحب عينة للتحليل."},
            {q: "ما حكم صيام من أدركه الفجر وهو جنب؟", a: "صيامه صحيح، وعليه الاغتسال لإدراك الصلاة."},
            {q: "هل العطر والروائح تفطر؟", a: "لا تفطر، لكن يكره استنشاق البخور عمداً لوصول أجزاء منه للمعدة."},
            {q: "حكم استخدام التحاميل للصائم؟", a: "لا تفطر لأنها لا تدخل من منفذ الطعام والشراب."},
            {q: "هل القيء المتعمد يفطر؟", a: "نعم يفطر، لقوله ﷺ: (من استقاء عمداً فليقض)."},
            {q: "حكم المضمضة والاستنشاق؟", a: "جائزة بل مسنونة، لكن يكره المبالغة فيهما للصائم خشية وصول الماء للجوف."},
            {q: "ما حكم الجماع في نهار رمضان؟", a: "محرم ويبطل الصوم، وعليه الكفارة المغلظة (عتق رقبة، أو صيام شهرين، أو إطعام 60 مسكيناً)."},
            {q: "هل نية الصيام تكفي للشهر كله؟", a: "نعم تكفي نية واحدة في أول الشهر ما لم يقطعه بسفر أو مرض."},
            {q: "حكم الأكل مع الشك في طلوع الفجر؟", a: "الأصل بقاء الليل وصومه صحيح، لكن الأفضل الإمساك عند الأذان."},
            {q: "حكم صيام المريض الذي يشق عليه؟", a: "يشرع له الفطر والقضاء بعد رمضان، لقوله تعالى: (فمن كان منكم مريضاً)."},
            {q: "هل قطرة الأنف تفطر؟", a: "إذا وصلت للحلق فإنها تفطر لأن الأنف منفذ للمعدة."},
            {q: "ما حكم الحجامة للصائم؟", a: "محل خلاف، والراجح أنها لا تفطر ولكن يكره فعلها إن كانت تضعف الصائم."},
            {q: "حكم بلع النخامة؟", a: "لا تفطر، لكن يجب لفظها وعدم بلعها استقذاراً."},
            {q: "هل السواك يفطر بعد الزوال؟", a: "لا يفطر، بل هو مسنون في كل وقت للصائم."},
            {q: "حكم صيام الحامل والمرضع؟", a: "يجوز لهما الفطر إذا خافتا على نفسيهما أو ولديهما وعليهما القضاء."},
            {q: "هل الإغماء يبطل الصوم؟", a: "إذا استغرق الإغماء كل النهار من الفجر للغروب يبطل، أما لو أفاق جزءاً منه فصحيح."},
            {q: "ما حكم من أفطر يوماً متعمداً بلا عذر؟", a: "عليه التوبة العظيمة والقضاء، ولا تجزئه كفارة غير التوبة."},
            {q: "حكم التخدير الموضعي (البنج)؟", a: "لا يفطر، أما التخدير الكامل الذي يستغرق النهار فيبطل الصوم."},
            {q: "هل المكياج والكحل يفطر؟", a: "لا يفطران لأنهما زينة ظاهرية لا تصل للجوف."},
            {q: "حكم التدخين في نهار رمضان؟", a: "محرم ومفطر بالإجماع لوصول أجرام الدخان للمعدة."},
            {q: "ما هي كفارة من مات وعليه صيام؟", a: "يطعم عنه عن كل يوم مسكيناً، أو يصوم عنه وليه لقوله ﷺ: (من مات وعليه صيام صام عنه وليه)."},
            {q: "حكم صيام المسافر؟", a: "المسافر مخير بين الفطر والقضاء وبين الصيام، والأفضل الأيسر له."},
            {q: "هل السباحة والغوص يفطر؟", a: "لا يفطر ما لم يدخل الماء إلى جوفه."},
            {q: "حكم من طهرت من الحيض قبل الفجر؟", a: "يجب عليها الصيام ولو لم تغتسل إلا بعد طلوع الفجر."},
            {q: "هل الحبوب تحت اللسان لمرضى القلب تفطر؟", a: "لا تفطر لأنها تمتص ولا تنزل للمعدة."},
            {q: "حكم التبرع بالدم؟", a: "لا يفطر، لكن يكره إن كان يسبب الضعف للصائم."},
            {q: "هل الأوكسجين يفطر؟", a: "لا يفطر لأنه هواء خالص."},
            {q: "حكم الغسيل الكلوي للصائم؟", a: "يفطر لأنه يصاحبه تزويد الدم بمواد مغذية."},
            {q: "ما حكم استعمال بخاخ الأنف؟", a: "يفطر إذا وصل طعمه للحلق."},
            {q: "حكم من أكل وهو يظن أن الشمس غربت؟", a: "عليه القضاء عند جمهور العلماء."},
            {q: "هل قلع الضرس يفطر؟", a: "لا يفطر، مع الحذر من بلع الدم."},
            {q: "حكم إبر البنسلين؟", a: "لا تفطر لأنها علاجية غير مغذية."},
            {q: "ما حكم الحقنة الشرجية؟", a: "الراجح أنها لا تفطر لأنها لا تغذي."},
            {q: "حكم من أفطر لإنقاذ غريق؟", a: "يجوز له الفطر وعليه القضاء."},
            {q: "هل تقليم الأظافر وحلق الشعر يبطل الصوم؟", a: "لا علاقة له بصحة الصيام."},
            {q: "حكم وضع الحناء للصائمة؟", a: "جائز ولا يؤثر على الصيام."},
            {q: "ما مقدار زكاة الفطر؟", a: "صاع من طعام (حوالي 2.5 إلى 3 كيلو من قوت البلد)."},
            {q: "متى وقت إخراج زكاة الفطر؟", a: "من غروب شمس ليلة العيد إلى قبيل صلاة العيد، ويجوز تقديمها بيوم أو يومين."},
            {q: "هل تجزئ القيمة في زكاة الفطر؟", a: "الأصل إخراجها طعاماً، وأجاز بعض العلماء إخراج القيمة للمصلحة."},
            {q: "حكم صيام الست من شوال قبل القضاء؟", a: "الأفضل القضاء أولاً ثم الست لتحصيل أجر صيام الدهر."},
            {q: "ما حكم الكلام الفاحش أثناء الصيام؟", a: "لا يبطل الصوم حسياً لكن ينقص أجره جداً، فرب صائم ليس له من صومه إلا الجوع."}
        ];

        const container = document.getElementById('fatawaContainer');
        fatawa.forEach((f, i) => {
            container.innerHTML += `
                <div class="item" onclick="this.classList.toggle('active')">
                    <div class="q">${i+1}. ${f.q} <span>+</span></div>
                    <div class="a">${f.a}</div>
                </div>`;
        });
    </script>
</body>
</html>
