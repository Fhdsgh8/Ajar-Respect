<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajar Respect | الواجهة الرئيسية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Reem+Kufi:wght@400;700&display=swap');
        
        :root { --bg: #05040a; --gold: #c5a059; --card: rgba(20, 15, 35, 0.9); }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Reem Kufi', sans-serif; 
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .logo-area { text-align: center; margin-bottom: 40px; margin-top: 20px; }
        .logo-area h1 { font-family: 'Amiri'; color: var(--gold); font-size: 45px; margin: 0; text-shadow: 0 0 15px rgba(197, 160, 89, 0.5); }
        .logo-area p { opacity: 0.7; font-size: 14px; letter-spacing: 2px; }

        /* نظام الشبكة: عمودين متساويين */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* عمودين */
            gap: 15px; /* المسافة بين الأزرار */
            width: 100%;
            max-width: 500px;
        }

        .menu-item {
            background: var(--card);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 15px;
            padding: 25px 10px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: 0.3s all ease;
        }

        .menu-item i { color: var(--gold); font-size: 28px; margin-bottom: 12px; }
        .menu-item span { font-size: 16px; font-weight: bold; }

        .menu-item:active {
            transform: scale(0.95);
            background: var(--gold);
            color: black;
        }
        .menu-item:active i { color: black; }

        /* زر مميز للمصحف أو الأقسام الكبيرة */
        .full-width {
            grid-column: span 2; /* يأخذ العرض كاملاً */
            margin-top: 10px;
            background: linear-gradient(45deg, #110c22, #1a1432);
            border-color: var(--gold);
        }
    </style>
</head>
<body>

    <div class="logo-area">
        <h1>AJAR RESPECT</h1>
        <p>موسوعة المسلم الفاخرة</p>
    </div>

    <div class="menu-grid">
        <a href="azkar.html" class="menu-item">
            <i class="fa-solid fa-bead-tree"></i>
            <span>الأذكار</span>
        </a>

        <a href="qa.html" class="menu-item">
            <i class="fa-solid fa-clipboard-question"></i>
            <span>سؤال وجواب</span>
        </a>

        <a href="sharia.html" class="menu-item">
            <i class="fa-solid fa-gem"></i>
            <span>أسماء الله</span>
        </a>

        <a href="sharia.html" class="menu-item">
            <i class="fa-solid fa-shield-halved"></i>
            <span>كنوز السنة</span>
        </a>

        <a href="fiqh.html" class="menu-item">
            <i class="fa-solid fa-scale-balanced"></i>
            <span>فقه الصائم</span>
        </a>

        <a href="quotes.html" class="menu-item">
            <i class="fa-solid fa-scroll"></i>
            <span>روائع التابعين</span>
        </a>

        <a href="history_fiqh.html" class="menu-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>حدث في رمضان</span>
        </a>

        <a href="reading.html" class="menu-item">
            <i class="fa-solid fa-book-open"></i>
            <span>ملخصات الكتب</span>
        </a>

        <a href="quran.html" class="menu-item full-width">
            <i class="fa-solid fa-quran"></i>
            <span>القرآن الكريم</span>
        </a>
    </div>

    <footer style="margin-top: 50px; opacity: 0.5; font-size: 12px;">
        &copy; 2026 AJAR RESPECT - جميع الحقوق محفوظة
    </footer>

</body>
</html>
