<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajar Respect | الواجهة الرئيسية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Reem+Kufi:wght@400;700&display=swap');
        :root { --gold: #c5a059; --glass: rgba(255, 255, 255, 0.05); }
        body { margin: 0; background: #05040a; color: white; font-family: 'Reem Kufi', sans-serif; overflow-x: hidden; }
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: -1; }
        .wrapper { max-width: 500px; margin: auto; padding: 20px; text-align: center; }
        
        /* قسم عداد الصلاة والتاريخ الهجري */
        .prayer-timer {
            background: linear-gradient(135deg, rgba(197, 160, 89, 0.1), transparent);
            border: 1px solid var(--gold);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .prayer-timer h2 { margin: 0; font-size: 18px; color: var(--gold); }
        .prayer-timer #timer { font-size: 24px; font-weight: bold; margin: 5px 0; }
        .prayer-timer #hijriDate { font-size: 14px; opacity: 0.8; }

        .main-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-card {
            background: var(--glass);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 20px;
            padding: 20px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s;
        }
        .menu-card:active { transform: scale(0.95); border-color: var(--gold); }
        .menu-card i { font-size: 28px; margin-bottom: 10px; color: var(--gold); }
        .full-width { grid-column: span 2; }
        
        .quran-btn { background: rgba(197, 160, 89, 0.1); border: 1px solid var(--gold); padding: 30px; }
        .quran-btn i { font-size: 40px; }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="wrapper">
        <header style="margin-bottom:30px;">
            <h1 style="font-family:'Amiri'; font-size:40px; color:var(--gold); margin:0;">AJAR RESPECT</h1>
        </header>

        <div class="prayer-timer">
            <h2>الصلاة القادمة: <span id="prayerName">الظهر</span></h2>
            <div id="timer">00:00:00</div>
            <div id="hijriDate">جاري تحميل التاريخ الهجري...</div>
        </div>

        <nav class="main-menu">
            <a href="quran.html" class="menu-card full-width quran-btn">
                <i class="fa-solid fa-quran"></i>
                <span style="font-size:22px; font-family:'Amiri';">القرآن الكريم</span>
            </a>

            <a href="khatm.html" class="menu-card full-width" style="border-style: dashed;">
                <i class="fa-solid fa-book-open-reader"></i>
                <span>طرق ختم القرآن في رمضان</span>
            </a>

            <a href="prayers.html" class="menu-card">
                <i class="fa-solid fa-mosque"></i>
                <span>أوقات الصلاة</span>
            </a>
            <a href="azkar.html" class="menu-card">
                <i class="fa-solid fa-bead-tree"></i>
                <span>الأذكار</span>
            </a>
            <a href="community.html" class="menu-card">
                <i class="fa-solid fa-box-open"></i>
                <span>زاد المسلم</span>
            </a>
            <a href="books.html" class="menu-card">
                <i class="fa-solid fa-book"></i>
                <span>ملخصات الكتب</span>
            </a>
        </nav>
    </div>

    <script>
        // كود بسيط لعرض التاريخ الهجري (تجريبي)
        const date = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', {day:'numeric', month:'long', year:'numeric'}).format(new Date());
        document.getElementById('hijriDate').innerText = date;

        // عداد وهمي للصلاة القادمة (يمكن ربطه بـ API لاحقاً)
        function startTimer() {
            let seconds = 3600; // مثال: ساعة واحدة
            setInterval(() => {
                let h = Math.floor(seconds / 3600);
                let m = Math.floor((seconds % 3600) / 60);
                let s = seconds % 60;
                document.getElementById('timer').innerText = 
                    (h<10?'0':'')+h + ":" + (m<10?'0':'')+m + ":" + (s<10?'0':'')+s;
                if(seconds > 0) seconds--;
            }, 1000);
        }
        startTimer();

        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 50 },
                "color": { "value": "#c5a059" },
                "size": { "value": 2 },
                "move": { "enable": true, "speed": 1, "direction": "bottom" }
            }
        });
    </script>
</body>
</html>
