<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajar Respect | رمضان 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Reem+Kufi:wght@400;700&display=swap');

        :root {
            --gold: #c5a059;
            --dark-purple: #0a0a14;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(197, 160, 89, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at top, #1a1a2e, #0a0a14);
            color: white;
            font-family: 'Reem Kufi', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* خلفية النجوم المتحركة */
        #particles-js {
            position: fixed;
            width: 100%; height: 100%;
            z-index: -1;
        }

        .wrapper {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 40px 20px;
            text-align: center;
        }

        /* الهيدر الرمضاني */
        .ramadan-header { margin-bottom: 40px; animation: fadeInDown 1s ease; }
        .ramadan-header i { color: var(--gold); font-size: 50px; filter: drop-shadow(0 0 10px var(--gold)); }
        .ramadan-header h1 { 
            font-family: 'Amiri'; 
            font-size: 45px; 
            margin: 10px 0 0; 
            background: linear-gradient(to bottom, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* شبكة الأزرار الفخمة */
        .main-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .menu-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 10px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeInUp 0.5s ease backwards;
        }

        .menu-card i {
            font-size: 30px;
            margin-bottom: 12px;
            color: var(--gold);
            transition: 0.3s;
        }

        .menu-card span { font-weight: 700; font-size: 15px; }

        /* تأثيرات الحركة */
        .menu-card:hover, .menu-card:active {
            background: rgba(197, 160, 89, 0.1);
            border-color: var(--gold);
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .menu-card:active i { transform: rotate(15deg) scale(1.2); }

        /* الزر المميز (القرآن) */
        .highlighted {
            grid-column: span 2;
            padding: 35px;
            background: linear-gradient(135deg, rgba(197, 160, 89, 0.15), transparent);
            border: 1px solid var(--gold);
        }
        .highlighted i { font-size: 45px; }
        .highlighted span { font-family: 'Amiri'; font-size: 24px; margin-top: 5px; }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer { margin-top: 60px; opacity: 0.5; font-size: 12px; font-weight: 300; }

    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="wrapper">
        <header class="ramadan-header">
            <i class="fa-solid fa-moon"></i>
            <h1>AJAR RESPECT</h1>
            <p style="color: var(--gold); letter-spacing: 2px;">موسوعة رمضان الإيمانية</p>
        </header>

        <nav class="main-menu">
            <a href="quran.html" class="menu-card highlighted" style="animation-delay: 0.1s;">
                <i class="fa-solid fa-quran"></i>
                <span>القرآن الكريم</span>
            </a>

            <a href="prayer.html" class="menu-card" style="animation-delay: 0.2s;">
                <i class="fa-solid fa-mosque"></i>
                <span>أوقات الصلاة</span>
            </a>

            <a href="tasbih.html" class="menu-card" style="animation-delay: 0.3s;">
                <i class="fa-solid fa-fingerprint"></i>
                <span>سبحة الكترونية</span>
            </a>

            <a href="azkar.html" class="menu-item menu-card" style="animation-delay: 0.4s;">
                <i class="fa-solid fa-dharmachakra"></i>
                <span>الأذكار</span>
            </a>

            <a href="zad.html" class="menu-card" style="animation-delay: 0.5s;">
                <i class="fa-solid fa-box-open"></i>
                <span>زاد المسلم</span>
            </a>

            <a href="names.html" class="menu-card" style="animation-delay: 0.6s;">
                <i class="fa-solid fa-gem"></i>
                <span>أسماء الله</span>
            </a>

            <a href="sunnah.html" class="menu-card" style="animation-delay: 0.7s;">
                <i class="fa-solid fa-shield-halved"></i>
                <span>كنوز السنة</span>
            </a>

            <a href="fiqh.html" class="menu-card" style="animation-delay: 0.8s;">
                <i class="fa-solid fa-scale-balanced"></i>
                <span>فقه الصائم</span>
            </a>

            <a href="qa.html" class="menu-card" style="animation-delay: 0.9s;">
                <i class="fa-solid fa-clipboard-question"></i>
                <span>سؤال وجواب</span>
            </a>

            <a href="quotes.html" class="menu-card" style="animation-delay: 1s;">
                <i class="fa-solid fa-scroll"></i>
                <span>روائع التابعين</span>
            </a>

            <a href="history.html" class="menu-card" style="animation-delay: 1.1s;">
                <i class="fa-solid fa-calendar-check"></i>
                <span>حدث في رمضان</span>
            </a>

            <a href="books.html" class="menu-card highlighted" style="animation-delay: 1.2s; margin-top: 10px;">
                <i class="fa-solid fa-book-quran"></i>
                <span>ملخصات الكتب</span>
            </a>
        </nav>

        <footer>
            &copy; 2026 AJAR RESPECT - طوّر بحب لنيل الأجر
        </footer>
    </div>

    <script>
        /* إعدادات النجوم المتحركة (غبار الذهب) */
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80 },
                "color": { "value": "#c5a059" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": true },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": false },
                "move": { "enable": true, "speed": 1, "direction": "bottom", "random": true, "straight": false, "out_mode": "out" }
            },
            "interactivity": { "events": { "onhover": { "enable": true, "mode": "bubble" } } }
        });
    </script>
</body>
</html>
