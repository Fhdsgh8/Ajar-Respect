<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أجر ريسبكت | الموسوعة الإسلامية الكبرى</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #050210; --card: rgba(25, 20, 50, 0.95); --glow: rgba(212, 175, 55, 0.3); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }
        
        /* واجهة رمضانية متحركة */
        .stars-bg { position: fixed; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle, #1a103d, #050210); }
        .star { position: absolute; background: white; border-radius: 50%; animation: blink var(--d) infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

        .page { display: none; padding: 20px; max-width: 900px; margin: auto; animation: fadeIn 0.5s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* الهيدر */
        .header { text-align: center; padding: 30px 0; }
        .logo { font-family: 'Amiri', serif; font-size: 4rem; color: var(--gold); text-shadow: 0 0 20px var(--glow); margin-bottom: 5px; }

        /* --- تعديل واجهة العداد الفخمة --- */
        .timer-wrapper {
            background: var(--card);
            border: 2px solid var(--gold);
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px var(--glow);
            margin-bottom: 30px;
            overflow: hidden;
        }
        .timer-wrapper::before {
            content: '☪';
            position: absolute;
            top: -10px; left: 10px;
            font-size: 3rem; color: var(--gold); opacity: 0.1;
        }
        #next-prayer-text { 
            font-size: 1.2rem; 
            color: var(--gold); 
            letter-spacing: 1px; 
            margin-bottom: 10px;
            font-weight: 700;
        }
        #countdown { 
            font-size: 4rem; 
            color: white; 
            font-family: monospace; 
            font-weight: 900; 
            text-shadow: 0 0 15px var(--gold);
            letter-spacing: 5px;
        }

        /* --- تعديل واجهة آية اليوم الفخمة --- */
        .aya-section {
            background: linear-gradient(145deg, rgba(35, 25, 70, 0.9), rgba(15, 10, 30, 0.95));
            border-right: 5px solid var(--gold);
            border-radius: 15px 30px 30px 15px;
            padding: 35px;
            margin-bottom: 30px;
            position: relative;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
        }
        .aya-section h3 {
            color: var(--gold);
            font-size: 1rem;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .aya-section h3::after { content: ''; flex: 1; height: 1px; background: var(--gold); opacity: 0.3; }
        #daily-aya { 
            font-family: 'Amiri', serif; 
            font-size: 2rem; 
            line-height: 1.8; 
            color: #fff;
            margin: 20px 0;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        #daily-tafseer { 
            font-size: 0.95rem; 
            color: var(--gold); 
            font-style: italic;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 15px;
        }

        /* الشبكة والأزرار */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.2); padding: 25px 10px; text-align: center; border-radius: 20px; cursor: pointer; transition: 0.4s ease; }
        .card:hover { border-color: var(--gold); transform: translateY(-10px); box-shadow: 0 10px 25px rgba(212,175,55,0.2); }
        .card i { font-size: 2.2rem; color: var(--gold); margin-bottom: 12px; display: block; }
        
        .btn-back { background: var(--gold); border: none; padding: 10px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-bottom: 25px; transition: 0.3s; }
        .btn-back:hover { background: #b8952d; }
    </style>
</head>
<body>

<div class="stars-bg" id="stars"></div>

<div id="home" class="page active">
    <div class="header">
        <h1 class="logo">أجر ريسبكت</h1>
        <p id="hijri-date" style="color: var(--gold); opacity: 0.8;"></p>
    </div>

    <div class="timer-wrapper">
        <div id="next-prayer-text">جاري الحساب...</div>
        <div id="countdown">00:00:00</div>
    </div>

    <div class="aya-section">
        <h3><i class="fas fa-feather-alt"></i> آية اليوم وتفسيرها</h3>
        <p id="daily-aya"></p>
        <p id="daily-tafseer"></p>
    </div>

    <div class="grid">
        <div class="card" onclick="openPage('quran-page')"><i class="fas fa-book-quran"></i><h3>القرآن</h3></div>
        <div class="card" onclick="openPage('azkar-page')"><i class="fas fa-hands-praying"></i><h3>الأذكار</h3></div>
        <div class="card" onclick="openPage('hadith-page')"><i class="fas fa-scroll"></i><h3>الأحاديث</h3></div>
        <div class="card" onclick="openPage('stories-page')"><i class="fas fa-mosque"></i><h3>القصص</h3></div>
        <div class="card" onclick="openPage('quiz-page')"><i class="fas fa-trophy"></i><h3>التحديات</h3></div>
        <div class="card" onclick="openPage('sebha-page')"><i class="fas fa-fingerprint"></i><h3>المسبحة</h3></div>
        <div class="card" style="background: linear-gradient(45deg, #1d976c, #11998e); border:none;" onclick="window.open('https://ehsan.sa')"><i class="fas fa-heart" style="color:white"></i><h3>صدقة</h3></div>
    </div>
</div>

<script>
    // حافظ على نفس الـ JavaScript الخاص بك دون تغيير لضمان عمل الوظائف
    // فقط تأكد من استدعاء الدوال getAya() و getPrayers() في window.onload
    
    // سأضع لك فقط الجزء المحدث من الـ Script لضمان التوافق
    
    async function getAya() {
        try {
            const res = await fetch('https://api.alquran.cloud/v1/aya/'+(Math.floor(Math.random()*6236)+1)+'/ar.jalalayn');
            const d = await res.json();
            document.getElementById('daily-aya').innerText = "﴿ " + d.data.text + " ﴾";
            document.getElementById('daily-tafseer').innerText = "سورة "+d.data.surah.name + " - آية " + d.data.numberInSurah;
        } catch(e) { 
            document.getElementById('daily-aya').innerText = "لا إله إلا أنت سبحانك إني كنت من الظالمين"; 
        }
    }

    // نفس سكريبت النجوم والصفحات والعداد من كودك السابق يستمر هنا...
    // (ضع بقية الـ Script هنا)
</script>
</body>
</html>
