<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أجر ريسبكت | Ajar Respect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0f0a1e; 
            --card: #1a142d; 
            --accent: #a37cf0; 
            --gold: #D4AF37; 
            --text: #ffffff; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Cairo', sans-serif; 
            background: var(--bg); 
            background-image: radial-gradient(circle at top right, #1e1042, #0f0a1e);
            color: var(--text); 
            min-height: 100vh; 
            overflow-x: hidden; 
        }

        /* نظام الصفحات */
        .page { display: none; padding: 20px; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* الهيدر والشبكة الرئيسية */
        header { text-align: center; padding: 40px 20px; }
        .logo { font-size: 2.5rem; color: var(--gold); text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); font-weight: 900; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 15px; 
            max-width: 900px; 
            margin: 0 auto; 
        }

        .nav-card { 
            background: var(--card); 
            border-radius: 20px; 
            padding: 25px; 
            text-align: center; 
            cursor: pointer; 
            border: 1px solid rgba(255,255,255,0.05); 
            transition: 0.3s; 
        }
        .nav-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .nav-card i { font-size: 2.2rem; margin-bottom: 12px; display: block; }

        .btn-back { 
            background: var(--gold); 
            border: none; 
            padding: 10px 25px; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-bottom: 25px; 
            color: #0f0a1e;
            transition: 0.3s;
        }
        .btn-back:hover { opacity: 0.8; }

        /* 1. تعديل القرآن: يظهر في نصف الصفحة وبدون أطراف زائدة */
        .quran-container { 
            width: 95%; 
            max-width: 800px; /* ليأخذ نصف مساحة الشاشة تقريباً في الأجهزة الكبيرة */
            margin: 0 auto; 
            height: 80vh; 
            border-radius: 20px; 
            overflow: hidden; 
            border: 4px solid var(--card); 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        #quran-frame { width: 100%; height: 100%; border: none; }

        /* 2. زاد المسلم: الكروت منظمة */
        .zad-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            max-width: 1100px;
            margin: auto;
        }
        .info-card { 
            background: var(--card); 
            border-radius: 15px; 
            padding: 20px; 
            border-top: 4px solid var(--accent); 
            position: relative;
        }
        .info-card h3 { color: var(--gold); margin-bottom: 10px; font-size: 1.1rem; }
        .info-card p { color: #ccc; font-size: 0.95rem; line-height: 1.6; }
        .card-num { position: absolute; bottom: 10px; left: 15px; font-size: 0.7rem; color: #444; }

        /* 3. التحديات: نظام إجابة صارم */
        .quiz-container {
            max-width: 600px; 
            margin: 20px auto; 
            background: var(--card); 
            padding: 30px; 
            border-radius: 25px; 
            text-align: center;
            border: 1px solid var(--accent);
        }
        .option-btn { 
            display: block; 
            width: 100%; 
            padding: 18px; 
            margin: 12px 0; 
            background: #251c3d; 
            color: white; 
            border: 1px solid rgba(163, 124, 240, 0.3); 
            border-radius: 15px; 
            cursor: pointer; 
            font-size: 1.1rem;
            transition: 0.2s;
        }
        .option-btn.correct { background: #2ecc71 !important; border-color: #27ae60; font-weight: bold; }
        .option-btn.wrong { background: #e74c3c !important; border-color: #c0392b; }
        .disabled { pointer-events: none; } /* يمنع الضغط مرة أخرى */

    </style>
</head>
<body>

<div id="home" class="page active">
    <header><h1 class="logo">أجر ريسبكت</h1></header>
    <div class="grid">
        <div class="nav-card" onclick="showPage('quran-page')">
            <i class="fas fa-book-quran" style="color: #fbbf24;"></i>
            <h3>القرآن الكريم</h3>
        </div>
        <div class="nav-card" onclick="showPage('zad-page')">
            <i class="fas fa-book-open-reader" style="color: #a37cf0;"></i>
            <h3>زاد المسلم</h3>
        </div>
        <div class="nav-card" onclick="showPage('quiz-page')">
            <i class="fas fa-trophy" style="color: #f87171;"></i>
            <h3>تحديات دينية</h3>
        </div>
    </div>
</div>

<div id="quran-page" class="page">
    <button class="btn-back" onclick="showPage('home')">← العودة للرئيسية</button>
    <div class="quran-container">
        <iframe id="quran-frame" src="https://quran.com/ar"></iframe>
    </div>
</div>

<div id="zad-page" class="page">
    <button class="btn-back" onclick="showPage('home')">← العودة للرئيسية</button>
    <h2 style="text-align: center; margin-bottom: 30px; color: var(--gold);">موسوعة زاد المسلم (150 معلومة)</h2>
    <div class="zad-grid" id="zadGrid"></div>
</div>

<div id="quiz-page" class="page">
    <button class="btn-back" onclick="showPage('home')">← العودة للرئيسية</button>
    <div class="quiz-container">
        <h3 id="question-text" style="margin-bottom: 25px; font-size: 1.4rem;">...</h3>
        <div id="options-container"></div>
        <p id="timer-msg" style="margin-top: 15px; color: var(--gold); font-size: 0.9rem; opacity: 0;">ينقلكم للسؤال التالي...</p>
    </div>
</div>

<script>
    // التنقل بين الصفحات
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        
        if(pageId === 'zad-page') renderZad();
        if(pageId === 'quiz-page') loadQuestion();
    }

    // منطق زاد المسلم (توليد 150 معلومة)
    function renderZad() {
        const grid = document.getElementById('zadGrid');
        grid.innerHTML = "";
        const dataTemplates = [
            { t: "فضل صلاة الضحى", c: "صلاة الأوابين، تجزئ عن 360 صدقة عن مفاصل جسم الإنسان." },
            { t: "سورة الملك", c: "هي المنجية من عذاب القبر، يسن قراءتها كل ليلة قبل النوم." },
            { t: "أركان الإسلام", c: "الشهادتان، الصلاة، الزكاة، الصوم، وحج البيت." },
            { t: "كفارة المجلس", c: "سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت، أستغفرك وأتوب إليك." },
            { t: "فضل الاستغفار", c: "من لزم الاستغفار جعل الله له من كل هم فرجاً ومن كل ضيق مخرجاً." }
        ];

        for(let i=0; i<150; i++) {
            let item = dataTemplates[i % dataTemplates.length];
            grid.innerHTML += `
                <div class="info-card">
                    <h3>${item.t} #${i+1}</h3>
                    <p>${item.content || item.c}</p>
                    <span class="card-num">معلومة ${i+1}</span>
                </div>`;
        }
    }

    // منطق التحديات (عدم السماح بالتعديل + تحويل تلقائي)
    const questions = [
        { q: "ما هي أطول سورة في القرآن الكريم؟", o: ["آل عمران", "البقرة", "النساء"], c: 1 },
        { q: "من هو النبي الملقب بـ 'أبو الأنبياء'؟", o: ["موسى", "عيسى", "إبراهيم"], c: 2 },
        { q: "ما هي الصلاة التي ليس فيها ركوع ولا سجود؟", o: ["صلاة الجنازة", "صلاة الوتر", "صلاة الاستسقاء"], c: 0 },
        { q: "في أي شهر نزل القرآن الكريم؟", o: ["شعبان", "رمضان", "ذو الحجة"], c: 1 }
    ];
    let qIndex = 0;

    function loadQuestion() {
        const q = questions[qIndex];
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container');
        document.getElementById('timer-msg').style.opacity = "0";
        container.innerHTML = "";

        q.o.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(i, q.c, btn);
            container.appendChild(btn);
        });
    }

    function handleAnswer(selected, correct, btn) {
        const btns = document.querySelectorAll('.option-btn');
        
        // منع أي ضغطة أخرى فوراً
        btns.forEach(b => b.classList.add('disabled'));

        if(selected === correct) {
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
            btns[correct].classList.add('correct'); // تلوين الإجابة الصحيحة ليعرفها المستخدم
        }

        document.getElementById('timer-msg').style.opacity = "1";

        // الانتقال التلقائي الصارم بعد 1.5 ثانية
        setTimeout(() => {
            qIndex = (qIndex + 1) % questions.length;
            loadQuestion();
        }, 1500);
    }
</script>
</body>
</html>
