<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajar Respect | الموسوعة الرمضانية الكبرى</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Reem+Kufi:wght@400;700&display=swap');

        :root {
            --gold: #c5a059;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(197, 160, 89, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at top, #1a1a2e, #05040a);
            color: white;
            font-family: 'Reem Kufi', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* خلفية غبار الذهب المتحرك */
        #particles-js {
            position: fixed;
            width: 100%; height: 100%;
            z-index: -1;
        }

        .wrapper {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 40px 20px;
            text-align: center;
        }

        .ramadan-header { margin-bottom: 40px; animation: fadeIn 1.5s ease; }
        .ramadan-header i { color: var(--gold); font-size: 55px; filter: drop-shadow(0 0 15px var(--gold)); }
        .ramadan-header h1 { 
            font-family: 'Amiri'; 
            font-size: 48px; 
            margin: 10px 0 0; 
            background: linear-gradient(to bottom, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* شبكة الأزرار */
        .main-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .menu-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 10px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .menu-card i { font-size: 28px; margin-bottom: 12px; color: var(--gold); }
        .menu-card span { font-weight: 700; font-size: 15px; }

        /* القرآن الكريم - الزر الأول عرض كامل */
        .quran-btn {
            grid-column: span 2;
            padding: 35px;
            background: linear-gradient(135deg, rgba(197, 160, 89, 0.15), transparent);
            border: 1px solid var(--gold);
        }
        .quran-btn i { font-size: 45px; }
        .quran-btn span { font-family: 'Amiri'; font-size: 24px; }

        /* تأثيرات الحركة والضغط */
        .menu-card:hover, .menu-card:active {
            background: rgba(197, 160, 89, 0.1);
            border-color: var(--gold);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        footer { margin-top: 50px; opacity: 0.4; font-size: 11px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="wrapper">
        <header class="ramadan-header">
            <i class="fa-solid fa-moon"></i>
            <h1>AJAR RESPECT</h1>
            <p style="color: var(--gold); font-size: 14px; margin-top: 5px;">موسوعة رمضان الإيمانية 2026</p>
        </header>

        <nav class="main-menu">
            <a href="quran.html" class="menu-card quran-btn">
                <i class="fa-solid fa-quran"></i>
                <span>القرآن الكريم</span>
            </a>

            <a href="prayers.html" class="menu-card">
                <i class="fa-solid fa-mosque"></i>
                <span>أوقات الصلاة</span>
            </a>

            <a href="tasbih.html" class="menu-card">
                <i class="fa-solid fa-fingerprint"></i>
                <span>السبحة الإلكترونية</span>
            </a>

            <a href="azkar.html" class="menu-card">
                <i class="fa-solid fa-bead-tree"></i>
                <span>الأذكار</span>
            </a>

            <a href="community.html" class="menu-card">
                <i class="fa-solid fa-box-open"></i>
                <span>زاد المسلم</span>
            </a>

            <a href="names.html" class="menu-card">
                <i class="fa-solid fa-gem"></i>
                <span>أسماء الله</span>
            </a>

            <a href="sunnah.html" class="menu-card">
                <i class="fa-solid fa-shield-halved"></i>
                <span>كنوز السنة</span>
            </a>

            <a href="fiqh.html" class="menu-card">
                <i class="fa-solid fa-scale-balanced"></i>
                <span>فقه الصائم</span>
            </a>

            <a href="qa.html" class="menu-card">
                <i class="fa-solid fa-clipboard-question"></i>
                <span>سؤال وجواب</span>
            </a>

            <a href="quotes.html" class="menu-card">
                <i class="fa-solid fa-scroll"></i>
                <span>روائع التابعين</span>
            </a>

            <a href="history.html" class="menu-card">
                <i class="fa-solid fa-calendar-day"></i>
                <span>حدث في رمضان</span>
            </a>

            <a href="books.html" class="menu-card quran-btn" style="margin-top: 10px;">
                <i class="fa-solid fa-book-quran"></i>
                <span>ملخصات الكتب</span>
            </a>
        </nav>

        <footer>
            &copy; 2026 AJAR RESPECT - جميع الحقوق محفوظة
        </footer>
    </div>

    <script>
        /* إعدادات النجوم الذهبية المتحركة */
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 70 },
                "color": { "value": "#c5a059" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4, "random": true },
                "size": { "value": 2.5, "random": true },
                "move": { "enable": true, "speed": 0.8, "direction": "bottom", "out_mode": "out" }
            }
        });
    </script>
</body>
</html>
