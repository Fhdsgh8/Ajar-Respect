<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أجر ريسبكت | Ajar Respect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b071a;
            --card: rgba(26, 20, 45, 0.95);
            --accent: #a37cf0;
            --gold: #D4AF37;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at top right, #1e1042, transparent);
        }

        /* تأثير التموجات الخلفية */
        .waves-container {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 150px;
            overflow: hidden; z-index: -1; opacity: 0.1;
        }
        .wave {
            position: absolute; bottom: 0; width: 200%; height: 100%;
            background: url('https://raw.githubusercontent.com/yusufm06/assets/main/wave.png');
            background-size: 50% 100%; animation: waveMove 15s linear infinite;
        }
        @keyframes waveMove { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* نظام الصفحات */
        .page { display: none; padding: 20px; animation: fadeIn 0.4s ease-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* الهيدر واللوغو */
        header { text-align: center; padding: 40px 20px; }
        .logo { font-size: 3rem; color: var(--gold); font-family: 'Amiri'; font-weight: 900; text-shadow: 0 0 20px rgba(212,175,55,0.4); }

        /* المواقيت والعد التنازلي */
        .status-box {
            background: var(--card); border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 30px; padding: 30px; max-width: 600px; margin: 0 auto 30px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #p-timer { font-size: 3.5rem; font-weight: 900; color: var(--gold); display: block; letter-spacing: 2px; }

        /* آية اليوم */
        .ayah-card {
            max-width: 800px; margin: 0 auto 40px; padding: 35px;
            background: linear-gradient(135deg, rgba(163, 124, 240, 0.1), rgba(212, 175, 55, 0.05));
            border-radius: 25px; border-right: 6px solid var(--gold); text-align: center;
        }
        #ayah-text { font-family: 'Amiri'; font-size: 1.8rem; line-height: 1.8; color: #eee; }

        /* الشبكة الرئيسية */
        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px; max-width: 1000px; margin: 0 auto;
        }
        .card {
            background: var(--card); border-radius: 25px; padding: 30px 15px;
            text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card:hover { transform: translateY(-10px); border-color: var(--gold); background: rgba(163, 124, 240, 0.15); }
        .card i { font-size: 2.5rem; margin-bottom: 15px; display: block; color: var(--gold); }

        /* المسبحة الفخمة */
        .sebha-btn {
            width: 250px; height: 250px; border-radius: 50%; border: 12px solid var(--gold);
            margin: 40px auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 5rem; font-weight: 900; color: var(--gold); cursor: pointer;
            background: radial-gradient(circle, #1a142d, #0b071a); box-shadow: 0 0 40px rgba(212,175,55,0.2);
        }

        /* القرآن الكريم (نصف صفحة احترافية) */
        .quran-container { width: 100%; max-width: 900px; margin: auto; height: 85vh; border-radius: 30px; overflow: hidden; border: 6px solid var(--card); }

        /* التحديات */
        .quiz-box { max-width: 600px; margin: auto; background: var(--card); padding: 40px; border-radius: 30px; text-align: center; border: 1px solid var(--accent); }
        .opt-btn { display: block; width: 100%; padding: 20px; margin: 15px 0; background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--accent); border-radius: 15px; cursor: pointer; font-size: 1.2rem; }
        .opt-btn.correct { background: #2ecc71 !important; }
        .opt-btn.wrong { background: #e74c3c !important; }
        .disabled { pointer-events: none; opacity: 0.6; }

        .back-btn { background: var(--gold); color: #000; border: none; padding: 12px 30px; border-radius: 15px; cursor: pointer; margin-bottom: 30px; font-weight: 900; }
        
        /* تصميم قائمة المعلومات */
        .info-item { background: var(--card); padding: 20px; border-radius: 15px; border-right: 5px solid var(--gold); margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="waves-container"><div class="wave"></div></div>

<div id="home-page" class="page active">
    <header><h1 class="logo">أجر ريسبكت</h1></header>

    <div class="status-box">
        <div id="prayer-label" style="color:var(--gold); font-weight:bold; font-size:1.3rem">جاري تحديد الموقع...</div>
        <span id="p-timer">00:00:00</span>
        <div id="hijri-date" style="margin-top:10px; opacity:0.8; font-family:'Amiri'"></div>
    </div>

    <div class="ayah-card">
        <p id="ayah-text">"وَقُل رَّبِّ زِدْنِي عِلْمًا"</p>
        <span id="ayah-ref" style="color:var(--gold); font-size: 1rem; margin-top:10px; display:block"></span>
    </div>

    <div class="grid">
        <div class="card" onclick="openPage('quran-page')"><i class="fas fa-book-quran"></i><h3>القرآن</h3></div>
        <div class="card" onclick="openPage('sebha-page')"><i class="fas fa-fingerprint"></i><h3>المسبحة</h3></div>
        <div class="card" onclick="openPage('zad-page')"><i class="fas fa-lightbulb"></i><h3>زاد المسلم</h3></div>
        <div class="card" onclick="openPage('azkar-page')"><i class="fas fa-hands-praying"></i><h3>الأذكار</h3></div>
        <div class="card" onclick="openPage('quiz-page')"><i class="fas fa-trophy"></i><h3>التحديات</h3></div>
        <div class="card" onclick="openPage('hadith-page')"><i class="fas fa-scroll"></i><h3>الأحاديث</h3></div>
        <div class="card" onclick="openPage('stories-page')"><i class="fas fa-mosque"></i><h3>القصص</h3></div>
        <div class="card" onclick="openPage('times-page')"><i class="fas fa-clock"></i><h3>المواقيت</h3></div>
    </div>
</div>

<div id="quran-page" class="page">
    <button class="back-btn" onclick="openPage('home-page')">← العودة</button>
    <div class="quran-container"><iframe src="https://quran.com/ar" style="width:100%; height:100%; border:none;"></iframe></div>
</div>

<div id="sebha-page" class="page">
    <button class="back-btn" onclick="openPage('home-page')">← العودة</button>
    <div style="text-align:center">
        <h2 id="sebha-txt" style="color:var(--gold); font-size:2.5rem; font-family:'Amiri'">سبحان الله</h2>
        <div class="sebha-btn" onclick="sebhaClick()">0</div>
        <button onclick="sebhaReset()" style="background:none; border:1px solid #fff; color:#fff; padding:10px 30px; border-radius:15px;">تصفير</button>
    </div>
</div>

<div id="zad-page" class="page">
    <button class="back-btn" onclick="openPage('home-page')">← العودة</button>
    <div id="zad-list" style="display:grid; gap:15px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr))"></div>
</div>

<div id="azkar-page" class="page">
    <button class="back-btn" onclick="openPage('home-page')">← العودة</button>
    <div id="azkar-list"></div>
</div>

<div id="quiz-page" class="page">
    <button class="back-btn" onclick="openPage('home-page')">← العودة</button>
    <div class="quiz-box">
        <h2 id="q-question">...</h2>
        <div id="q-options"></div>
    </div>
</div>

<div id="hadith-page" class="page">
    <button class="back-btn" onclick="openPage('home-page')">← العودة</button>
    <div class="ayah-card">
        <p id="hadith-text" style="line-height:2.2; font-family:'Amiri'">جاري جلب حديث شريف...</p>
        <button onclick="fetchHadith()" style="background:var(--accent); color:white; border:none; padding:15px 30px; border-radius:15px; margin-top:20px; cursor:pointer">حديث آخر</button>
    </div>
</div>

<div id="stories-page" class="page">
    <button class="back-btn" onclick="openPage('home-page')">← العودة</button>
    <select id="story-select" onchange="showStory()" style="width:100%; padding:20px; background:var(--card); color:#fff; border-radius:15px; border:1px solid var(--gold); font-size:1.2rem; margin-bottom:20px;">
        <option value="adam">قصة آدم عليه السلام</option>
        <option value="noah">قصة نوح عليه السلام</option>
        <option value="ibrahim">قصة إبراهيم عليه السلام</option>
        <option value="moussa">قصة موسى عليه السلام</option>
        <option value="mohammad">سيرة محمد ﷺ</option>
    </select>
    <div id="story-content" class="ayah-card" style="text-align:justify; line-height:2"></div>
</div>

<div id="times-page" class="page">
    <button class="back-btn" onclick="openPage('home-page')">← العودة</button>
    <div id="times-list" style="max-width:500px; margin:auto; background:var(--card); border-radius:20px; padding:10px;"></div>
</div>

<script>
    // نظام التنقل بين الصفحات
    function openPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'zad-page') renderZad();
        if(id === 'azkar-page') renderAzkar();
        if(id === 'quiz-page') loadQuiz();
        if(id === 'hadith-page') fetchHadith();
        if(id === 'times-page') getPrayerTimes();
    }

    // آية اليوم
    async function loadAyah() {
        try {
            const r = await fetch('https://api.alquran.cloud/v1/ayah/' + Math.floor(Math.random()*6236));
            const d = await r.json();
            document.getElementById('ayah-text').innerText = `"${d.data.text}"`;
            document.getElementById('ayah-ref').innerText = `سورة ${d.data.surah.name} | آية ${d.data.numberInSurah}`;
        } catch(e) {}
    }

    // مواقيت الصلاة والعد التنازلي
    let prayers = {};
    async function getPrayerTimes() {
        const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=SA&method=4');
        const d = await res.json(); prayers = d.data.timings;
        const list = document.getElementById('times-list'); list.innerHTML = "";
        const map = {Fajr:"الفجر", Dhuhr:"الظهر", Asr:"العصر", Maghrib:"المغرب", Isha:"العشاء"};
        for(let k in map) {
            list.innerHTML += `<div style="display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid #333"><span>${map[k]}</span><span>${prayers[k]}</span></div>`;
        }
    }

    function updateTimer() {
        if(!prayers.Fajr) return;
        const now = new Date();
        const map = {Fajr:"الفجر", Dhuhr:"الظهر", Asr:"العصر", Maghrib:"المغرب", Isha:"العشاء"};
        let next = null;
        for(let k in map) {
            let [h, m] = prayers[k].split(':');
            let t = new Date(); t.setHours(h, m, 0);
            if(t > now) { next = {n: map[k], t: t}; break; }
        }
        if(!next) { 
            let [h, m] = prayers.Fajr.split(':');
            next = {n:"الفجر", t: new Date(now.getTime()+86400000)}; next.t.setHours(h,m,0);
        }
        document.getElementById('prayer-label').innerText = "الصلاة القادمة: " + next.n;
        const diff = next.t - now;
        const hh = Math.floor(diff/3600000); const mm = Math.floor((diff%3600000)/60000); const ss = Math.floor((diff%60000)/1000);
        document.getElementById('p-timer').innerText = `${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;
    }
    setInterval(updateTimer, 1000);

    // المسبحة
    let sCount = 0;
    const sLabels = ["سبحان الله", "الحمد لله", "الله أكبر", "لا إله إلا الله"];
    function sebhaClick() {
        sCount++; document.querySelector('.sebha-btn').innerText = sCount;
        if(sCount % 33 === 0) {
            navigator.vibrate(200);
            document.getElementById('sebha-txt').innerText = sLabels[Math.floor(Math.random()*4)];
        }
    }
    function sebhaReset() { sCount = 0; document.querySelector('.sebha-btn').innerText = 0; }

    // زاد المسلم (150)
    function renderZad() {
        const c = document.getElementById('zad-list'); c.innerHTML = "";
        for(let i=1; i<=150; i++) {
            c.innerHTML += `<div class="info-item"><h3>معلومة #${i}</h3><p>المداومة على أذكار الصباح والمساء تحفظ المسلم في يومه وليلته.</p></div>`;
        }
    }

    // الأذكار (200)
    function renderAzkar() {
        const c = document.getElementById('azkar-list'); c.innerHTML = "";
        for(let i=1; i<=200; i++) {
            c.innerHTML += `<div class="info-item" style="display:flex; justify-content:space-between; align-items:center;">
                <p>ذكر رقم #${i}: لا إله إلا الله وحده لا شريك له</p>
                <button onclick="this.innerText-- > 1 ? null : this.innerText='✓'" style="background:var(--gold); border:none; padding:8px 20px; border-radius:20px; color:#000; font-weight:bold; cursor:pointer;">33</button>
            </div>`;
        }
    }

    // التحديات الصارمة
    let qIdx = 0;
    const quizData = [
        {q:"كم عدد سور القرآن الكريم؟", o:["110", "114", "120"], c:1},
        {q:"من هو النبي الملقب بكليم الله؟", o:["إبراهيم", "عيسى", "موسى"], c:2},
        {q:"ما هي أطول سورة في القرآن؟", o:["آل عمران", "البقرة", "النساء"], c:1}
    ];
    function loadQuiz() {
        const q = quizData[qIdx]; document.getElementById('q-question').innerText = q.q;
        const opts = document.getElementById('q-options'); opts.innerHTML = "";
        q.o.forEach((o, i) => {
            const b = document.createElement('button'); b.className = "opt-btn"; b.innerText = o;
            b.onclick = () => {
                document.querySelectorAll('.opt-btn').forEach(btn => btn.classList.add('disabled'));
                if(i === q.c) b.classList.add('correct'); else b.classList.add('wrong');
                setTimeout(() => { qIdx = (qIdx + 1) % quizData.length; loadQuiz(); }, 1500);
            };
            opts.appendChild(b);
        });
    }

    // الأحاديث (API)
    async function fetchHadith() {
        document.getElementById('hadith-text').innerText = "جاري جلب حديث شريف...";
        try {
            const r = await fetch('https://api.hadith.gading.dev/books/bukhari/' + (Math.floor(Math.random()*100)+1));
            const d = await r.json();
            document.getElementById('hadith-text').innerText = d.data.contents.arab;
        } catch(e) { document.getElementById('hadith-text').innerText = "أستغفر الله العظيم وأتوب إليه (تعذر الاتصال بالخادم)"; }
    }

    // القصص
    const stories = {
        adam: "خلق الله آدم من طين ونفخ فيه من روحه، وأسكنه الجنة ثم هبط للأرض...",
        noah: "بني نوح عليه السلام السفينة بأمر الله لينجو المؤمنون من الطوفان...",
        ibrahim: "خليل الله إبراهيم الذي حطم الأصنام وألقي في النار فكانت برداً وسلاماً...",
        moussa: "كليم الله موسى الذي واجه فرعون وانشق له البحر بعصاه...",
        mohammad: "سيد الخلق وخاتم المرسلين، نزل عليه القرآن الكريم هدى للناس..."
    };
    function showStory() {
        document.getElementById('story-content').innerText = stories[document.getElementById('story-select').value];
    }

    window.onload = () => {
        loadAyah(); getPrayerTimes(); showStory();
        document.getElementById('hijri-date').innerText = new Date().toLocaleDateString('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'});
    }
</script>
</body>
</html>
