<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajar Respect Pro | أجر ريسبكت الملكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #7c3aed;
            --gold: #D4AF37;
            --bg-dark: #1a0b2e;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #1a0b2e 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 50px;
        }

        /* آية اليوم */
        .top-ayah-box {
            max-width: 800px;
            margin: 30px auto;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--gold);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        .ayah-content { font-family: 'Amiri', serif; font-size: 1.8rem; line-height: 1.6; }

        /* العداد الذكي المتغير */
        .prayer-timer {
            text-align: center;
            margin-bottom: 40px;
        }
        .timer-display {
            display: inline-block;
            background: rgba(124, 58, 237, 0.1);
            border: 2px solid var(--primary-purple);
            padding: 20px 50px;
            border-radius: 50px;
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
        }
        .timer-label { font-size: 1rem; color: var(--gold); font-weight: bold; margin-bottom: 5px; }
        .timer-time { font-size: 3rem; font-weight: 900; font-family: 'monospace'; letter-spacing: 2px; }

        .container {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            padding: 20px;
        }
        .card {
            background: rgba(26, 11, 46, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 25px;
            padding: 35px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .card i { font-size: 50px; margin-bottom: 20px; }
        .counter-num { font-size: 3rem; font-weight: 900; color: var(--gold); display: block; }

        /* زاد المسلم */
        .zad-section {
            max-width: 1200px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(0,0,0,0.3);
            border-radius: 30px;
            border: 1px solid var(--primary-purple);
        }
        #searchInput {
            width: 100%; padding: 15px; border-radius: 30px; border: 1px solid var(--primary-purple);
            background: transparent; color: white; margin-bottom: 20px;
        }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; max-height: 400px; overflow-y: auto; }
        .info-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; border-right: 3px solid var(--primary-purple); }

        footer { text-align: center; padding: 40px; opacity: 0.6; }
    </style>
</head>
<body>

<header style="text-align:center; padding: 50px 20px;">
    <h1 style="font-size: 3rem; font-weight: 900;">✨ أجر ريسبكت ✨</h1>
</header>

<div class="top-ayah-box">
    <div class="ayah-content" id="dailyAyah">"فَاصْبِرْ صَبْرًا جَمِيلًا"</div>
    <div id="ayahRef" style="color: var(--gold); margin-top: 10px;">[سورة المعارج: 5]</div>
</div>

<div class="prayer-timer">
    <div class="timer-display">
        <div class="timer-label" id="prayerName">جاري حساب الصلاة القادمة...</div>
        <div class="timer-time" id="countdown">00:00:00</div>
    </div>
</div>

<div class="container">
    <a href="#" class="card"><i class="fas fa-book-quran" style="color: #fbbf24;"></i><h2>الختمة والتفسير</h2></a>
    <a href="#" class="card"><i class="fas fa-hands-praying" style="color: #c084fc;"></i><h2>الأذكار</h2></a>
    
    <div class="card" style="cursor: pointer;" onclick="incrementTasbih()">
        <i class="fas fa-dharmachakra" style="color: #34d399;"></i>
        <h2>المسبحة الذكية</h2>
        <span class="counter-num" id="tasbihVal">0</span>
        <p>اضغط للتسبيح</p>
    </div>

    <a href="#" class="card"><i class="fas fa-mosque" style="color: #fcd34d;"></i><h2>قصص الأنبياء</h2></a>
    <a href="#" class="card"><i class="fas fa-clock" style="color: #60a5fa;"></i><h2>أوقات الصلاة</h2></a>
    <a href="https://ehsan.sa/donation" target="_blank" class="card" style="border-color: #4ade80;">
        <i class="fas fa-hand-holding-heart" style="color: #4ade80;"></i>
        <h2>صدقة جارية</h2>
    </a>
</div>

<div class="zad-section">
    <h2 style="text-align: center; color: var(--primary-purple);">📚 زاد المسلم (150 معلومة)</h2>
    <input type="text" id="searchInput" placeholder="ابحث في الموسوعة..." onkeyup="searchZad()">
    <div class="info-grid" id="zadGrid"></div>
</div>

<footer><p>صنع لوجه الله تعالى © 2026</p></footer>

<script>
    // 1. منطق مواقيت الصلاة التلقائي
    const prayerTimes = [
        { name: "صلاة الفجر", time: "04:50" },
        { name: "صلاة الظهر", time: "12:20" },
        { name: "صلاة العصر", time: "15:40" },
        { name: "صلاة المغرب", time: "18:10" },
        { name: "صلاة العشاء", time: "19:40" }
    ];

    function updateCountdown() {
        const now = new Date();
        let nextPrayer = null;

        for (let prayer of prayerTimes) {
            let pTime = new Date();
            let [h, m] = prayer.time.split(':');
            pTime.setHours(h, m, 0);

            if (pTime > now) {
                nextPrayer = { name: prayer.name, time: pTime };
                break;
            }
        }

        // إذا انتهت كل صلوات اليوم، الصلاة القادمة هي فجر الغد
        if (!nextPrayer) {
            let pTime = new Date();
            let [h, m] = prayerTimes[0].time.split(':');
            pTime.setDate(pTime.getDate() + 1);
            pTime.setHours(h, m, 0);
            nextPrayer = { name: prayerTimes[0].name, time: pTime };
        }

        const diff = nextPrayer.time - now;
        const hours = Math.floor(diff / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);

        document.getElementById('prayerName').innerText = `المتبقي لـ ${nextPrayer.name}`;
        document.getElementById('countdown').innerText = 
            `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
    }

    // 2. المسبحة الذكية
    let count = parseInt(localStorage.getItem('tasbihCount')) || 0;
    document.getElementById('tasbihVal').innerText = count;
    function incrementTasbih() {
        count++;
        document.getElementById('tasbihVal').innerText = count;
        localStorage.setItem('tasbihCount', count);
    }

    // 3. آية اليوم المتغيرة
    const ayahs = [
        { q: "وَاصْبِرْ لِحُكْمِ رَبِّكَ فَإِنَّكَ بِأَعْيُنِنَا", r: "الطور: 48" },
        { q: "أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ", r: "الرعد: 28" },
        { q: "إِنَّ مَعَ الْعُسْرِ يُسْرًا", r: "الشرح: 6" }
    ];
    function setAyah() {
        const d = new Date().getDate();
        const a = ayahs[d % ayahs.length];
        document.getElementById('dailyAyah').innerText = `"${a.q}"`;
        document.getElementById('ayahRef').innerText = `[سورة ${a.r}]`;
    }

    // 4. زاد المسلم
    function setupZad() {
        const grid = document.getElementById('zadGrid');
        let html = '';
        for(let i=1; i<=150; i++) {
            html += `<div class="info-card"><h4>معلومة دينية #${i}</h4><p>محتوى تعليمي وسنة نبوية رقم ${i} تضاف لموسوعتك.</p></div>`;
        }
        grid.innerHTML = html;
    }

    window.onload = () => {
        setAyah();
        setupZad();
        setInterval(updateCountdown, 1000);
    };
</script>
</body>
</html>
