<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أجر ريسبكت | Ajar Respect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b071a; --card: rgba(26, 20, 45, 0.9); --accent: #a37cf0; --gold: #D4AF37; --text: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* تموجات رمضانية خلفية */
        .waves { position: fixed; bottom: 0; left: 0; width: 100%; height: 15vh; opacity: 0.1; z-index: -1; }

        /* نظام الصفحات */
        .page { display: none; padding: 20px; animation: fadeIn 0.5s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* الهيدر والمواقيت */
        header { text-align: center; padding: 20px; }
        .logo { font-size: 2.5rem; color: var(--gold); font-family: 'Amiri'; font-weight: 900; }
        
        .status-bar { 
            background: var(--card); border: 1px solid var(--gold); border-radius: 20px; 
            padding: 20px; max-width: 600px; margin: 0 auto 20px; text-align: center;
        }
        #countdown { font-size: 2.5rem; font-weight: 900; color: var(--gold); display: block; }

        /* مشغل الأناشيد */
        .audio-player { position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: var(--card); padding: 10px; border-radius: 50px; border: 1px solid var(--gold); display: flex; align-items: center; gap: 10px; }
        .play-btn { background: var(--gold); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; color: #000; }

        /* الشبكة الرئيسية */
        .main-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; max-width: 900px; margin: 0 auto; }
        .nav-card { background: var(--card); border-radius: 20px; padding: 25px 10px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .nav-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .nav-card i { font-size: 2rem; margin-bottom: 10px; display: block; color: var(--gold); }

        /* الأقسام */
        .content-box { background: var(--card); border-radius: 20px; padding: 25px; margin-bottom: 15px; border-right: 5px solid var(--gold); }
        .quran-frame { width: 100%; max-width: 800px; margin: auto; height: 80vh; border-radius: 20px; overflow: hidden; border: 4px solid var(--card); }
        
        /* المسبحة */
        .sebha-circle { width: 200px; height: 200px; border-radius: 50%; border: 8px solid var(--gold); margin: 30px auto; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; font-weight: 900; cursor: pointer; }
        
        /* التحديات */
        .opt-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #0f0a1e; color: white; border: 1px solid var(--accent); border-radius: 12px; cursor: pointer; font-size: 1.1rem; }
        .opt-btn.correct { background: #2ecc71 !important; }
        .opt-btn.wrong { background: #e74c3c !important; }
        .disabled { pointer-events: none; }

        .btn-back { background: var(--gold); border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="audio-player">
    <button class="play-btn" onclick="toggleAudio()"><i id="play-icon" class="fas fa-play"></i></button>
    <span style="font-size: 0.8rem;">أناشيد رمضانية</span>
    <audio id="bg-audio" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
</div>

<div id="home" class="page active">
    <header><h1 class="logo">أجر ريسبكت</h1></header>
    
    <div class="status-bar">
        <div id="p-name" style="font-weight:bold; color:var(--gold)">جاري التحميل...</div>
        <span id="countdown">00:00:00</span>
        <div id="h-date" style="margin-top:10px; font-family:'Amiri'"></div>
    </div>

    <div class="content-box" style="text-align:center; border-right:none; border-bottom:3px solid var(--gold)">
        <p id="daily-ayah" style="font-family:'Amiri'; font-size:1.5rem">"وَقُل رَّبِّ زِدْنِي عِلْمًا"</p>
        <small id="ayah-ref" style="color:var(--gold)"></small>
    </div>

    <div class="main-grid">
        <div class="nav-card" onclick="showPage('quran')"><i class="fas fa-book-quran"></i><h3>القرآن</h3></div>
        <div class="nav-card" onclick="showPage('sebha')"><i class="fas fa-fingerprint"></i><h3>المسبحة</h3></div>
        <div class="nav-card" onclick="showPage('times')"><i class="fas fa-clock"></i><h3>المواقيت</h3></div>
        <div class="nav-card" onclick="showPage('zad')"><i class="fas fa-lightbulb"></i><h3>زاد المسلم</h3></div>
        <div class="nav-card" onclick="showPage('azkar')"><i class="fas fa-hands-praying"></i><h3>الأذكار</h3></div>
        <div class="nav-card" onclick="showPage('quiz')"><i class="fas fa-trophy"></i><h3>التحديات</h3></div>
        <div class="nav-card" onclick="showPage('hadith')"><i class="fas fa-scroll"></i><h3>الأحاديث</h3></div>
        <div class="nav-card" onclick="showPage('stories')"><i class="fas fa-mosque"></i><h3>القصص</h3></div>
    </div>
</div>

<div id="quran" class="page">
    <button class="btn-back" onclick="showPage('home')">عودة</button>
    <div class="quran-frame"><iframe src="https://quran.com/ar" style="width:100%; height:100%; border:none;"></iframe></div>
</div>

<div id="sebha" class="page">
    <button class="btn-back" onclick="showPage('home')">عودة</button>
    <div style="text-align:center">
        <h2 id="s-label" style="color:var(--gold)">سبحان الله</h2>
        <div class="sebha-circle" onclick="countS()">0</div>
        <button onclick="resS()" style="background:none; border:1px solid #fff; color:#fff; padding:5px 15px; border-radius:10px;">تصفير</button>
    </div>
</div>

<div id="zad" class="page">
    <button class="btn-back" onclick="showPage('home')">عودة</button>
    <div id="zad-list" style="display:grid; gap:15px; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr))"></div>
</div>

<div id="azkar" class="page">
    <button class="btn-back" onclick="showPage('home')">عودة</button>
    <div id="azkar-list"></div>
</div>

<div id="quiz" class="page">
    <button class="btn-back" onclick="showPage('home')">عودة</button>
    <div style="max-width:500px; margin:auto; background:var(--card); padding:30px; border-radius:20px; text-align:center;">
        <h3 id="q-txt">...</h3>
        <div id="q-opts"></div>
    </div>
</div>

<div id="hadith" class="page">
    <button class="btn-back" onclick="showPage('home')">عودة</button>
    <div class="content-box" style="text-align:center">
        <p id="h-txt" style="line-height:2">جاري التحميل من صحيح البخاري...</p>
        <button onclick="getHadith()" style="background:var(--accent); border:none; padding:10px 20px; color:#fff; border-radius:10px; margin-top:20px;">حديث آخر</button>
    </div>
</div>

<div id="stories" class="page">
    <button class="btn-back" onclick="showPage('home')">عودة</button>
    <select id="s-select" onchange="loadStory()" style="width:100%; padding:15px; background:var(--card); color:#fff; border-radius:10px; margin-bottom:20px;">
        <option value="adam">آدم عليه السلام</option>
        <option value="noah">نوح عليه السلام</option>
        <option value="ibrahim">إبراهيم عليه السلام</option>
        <option value="moussa">موسى عليه السلام</option>
    </select>
    <div id="story-body" class="content-box"></div>
</div>

<div id="times" class="page">
    <button class="btn-back" onclick="showPage('home')">عودة</button>
    <div id="times-data" style="max-width:400px; margin:auto; background:var(--card); border-radius:20px; padding:10px;"></div>
</div>

<script>
    // 1. نظام الصفحات
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'zad') renderZad();
        if(id === 'azkar') renderAzkar();
        if(id === 'quiz') loadQ();
        if(id === 'hadith') getHadith();
        if(id === 'times') fetchT();
    }

    // 2. مشغل الصوت
    function toggleAudio() {
        const a = document.getElementById('bg-audio');
        const icon = document.getElementById('play-icon');
        if(a.paused) { a.play(); icon.className = "fas fa-pause"; }
        else { a.pause(); icon.className = "fas fa-play"; }
    }

    // 3. المسبحة
    let sVal = 0;
    function countS() { 
        sVal++; document.querySelector('.sebha-circle').innerText = sVal;
        if(sVal % 33 == 0) navigator.vibrate(100);
    }
    function resS() { sVal = 0; document.querySelector('.sebha-circle').innerText = 0; }

    // 4. زاد المسلم (150 معلومة)
    function renderZad() {
        const list = document.getElementById('zad-list'); list.innerHTML = "";
        for(let i=1; i<=150; i++) {
            list.innerHTML += `<div class="content-box"><h4>معلومة #${i}</h4><p>المداومة على السنن الرواتب تبني لك بيتاً في الجنة.</p></div>`;
        }
    }

    // 5. الأذكار (200 ذكر)
    function renderAzkar() {
        const list = document.getElementById('azkar-list'); list.innerHTML = "";
        for(let i=1; i<=200; i++) {
            list.innerHTML += `<div class="content-box" style="display:flex; justify-content:space-between; align-items:center;">
                <p>ذكر #${i}: سبحان الله وبحمده</p>
                <button onclick="this.innerText-- > 1 ? null : this.innerText='✓'" style="background:var(--gold); border:none; padding:5px 15px; border-radius:20px;">33</button>
            </div>`;
        }
    }

    // 6. آية اليوم
    async function loadAyah() {
        const res = await fetch('https://api.alquran.cloud/v1/ayah/' + Math.floor(Math.random()*6236));
        const d = await res.json();
        document.getElementById('daily-ayah').innerText = `"${d.data.text}"`;
        document.getElementById('ayah-ref').innerText = `سورة ${d.data.surah.name} | آية ${d.data.numberInSurah}`;
    }

    // 7. المواقيت والعد التنازلي
    let pT = {};
    async function fetchT() {
        const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=SA&method=4');
        const d = await res.json(); pT = d.data.timings;
        const list = document.getElementById('times-data'); list.innerHTML = "";
        const names = {Fajr:"الفجر", Dhuhr:"الظهر", Asr:"العصر", Maghrib:"المغرب", Isha:"العشاء"};
        for(let k in names) list.innerHTML += `<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #444;"><span>${names[k]}</span><span>${pT[k]}</span></div>`;
    }

    function updateClock() {
        if(!pT.Fajr) return;
        const now = new Date();
        const names = {Fajr:"الفجر", Dhuhr:"الظهر", Asr:"العصر", Maghrib:"المغرب", Isha:"العشاء"};
        let next = null;
        for(let k in names) {
            let [h, m] = pT[k].split(':');
            let t = new Date(); t.setHours(h, m, 0);
            if(t > now) { next = {n: names[k], t: t}; break; }
        }
        if(!next) { let [h, m] = pT.Fajr.split(':'); next = {n:"الفجر", t:new Date(now.getTime()+86400000)}; next.t.setHours(h, m, 0); }
        
        document.getElementById('p-name').innerText = "الصلاة القادمة: " + next.n;
        const diff = next.t - now;
        const hh = Math.floor(diff/3600000); const mm = Math.floor((diff%3600000)/60000); const ss = Math.floor((diff%60000)/1000);
        document.getElementById('countdown').innerText = `${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;
    }
    setInterval(updateClock, 1000);

    // 8. التحديات (صارمة)
    let qI = 0;
    const qs = [{q:"كم عدد أجزاء القرآن؟", o:["20","30","60"], c:1}, {q:"من هو خاتم الأنبياء؟", o:["عيسى","موسى","محمد ﷺ"], c:2}];
    function loadQ() {
        const q = qs[qI]; document.getElementById('q-txt').innerText = q.q;
        const opts = document.getElementById('q-opts'); opts.innerHTML = "";
        q.o.forEach((o, i) => {
            const b = document.createElement('button'); b.className="opt-btn"; b.innerText = o;
            b.onclick = () => {
                document.querySelectorAll('.opt-btn').forEach(btn => btn.classList.add('disabled'));
                if(i===q.c) b.classList.add('correct'); else b.classList.add('wrong');
                setTimeout(() => { qI = (qI+1)%qs.length; loadQ(); }, 1500);
            };
            opts.appendChild(b);
        });
    }

    // 9. الأحاديث
    async function getHadith() {
        document.getElementById('h-txt').innerText = "جاري جلب حديث...";
        const res = await fetch('https://api.hadith.gading.dev/books/bukhari/' + Math.floor(Math.random()*100 + 1));
        const d = await res.json();
        document.getElementById('h-txt').innerText = d.data.contents.arab;
    }

    // 10. القصص
    const stories = {adam:"خلق الله آدم من طين وأمر الملائكة بالسجود له...", noah:"لبث نوح في قومه 950 سنة يدعوهم للتوحيد..."};
    function loadStory() { document.getElementById('story-body').innerText = stories[document.getElementById('s-select').value] || "جاري كتابة القصة..."; }

    window.onload = () => {
        loadAyah(); fetchT(); loadStory();
        document.getElementById('h-date').innerText = new Date().toLocaleDateString('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'});
    };
</script>
</body>
</html>
