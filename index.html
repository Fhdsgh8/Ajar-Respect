<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أجر ريسبكت | Ajar Respect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0a1e;
            --card: #1a142d;
            --accent: #a37cf0;
            --gold: #D4AF37;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at top right, #1e1042, #0f0a1e);
            color: var(--text);
            min-height: 100vh;
        }

        /* نظام التنقل */
        .page { display: none; padding: 20px; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* الهيدر */
        header { text-align: center; padding: 30px; }
        .logo { font-size: 2.5rem; font-weight: 900; color: var(--gold); text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }

        /* شبكة التحكم */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; max-width: 900px; margin: 0 auto; }
        .nav-card { background: var(--card); border-radius: 20px; padding: 25px 10px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .nav-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .nav-card i { font-size: 2rem; margin-bottom: 10px; display: block; }

        /* واجهة القرآن (تعديل الأطراف) */
        #quran-frame {
            width: 100%;
            height: 85vh;
            border: none;
            background: #fff;
            border-radius: 15px;
        }

        /* زاد المسلم */
        .zad-card { background: var(--card); border-radius: 15px; padding: 20px; margin-bottom: 15px; border-right: 5px solid var(--gold); }
        .zad-card h4 { color: var(--gold); margin-bottom: 10px; }

        /* التحديات */
        .option-btn { 
            display: block; width: 100%; padding: 15px; margin: 10px 0; 
            background: var(--card); color: white; border: 1px solid var(--accent); 
            border-radius: 12px; cursor: pointer; font-size: 1.1rem; 
        }
        .option-btn.correct { background: #2ecc71 !important; border-color: #27ae60; }
        .option-btn.wrong { background: #e74c3c !important; border-color: #c0392b; }
        .disabled { pointer-events: none; }

        .btn-back { background: var(--gold); border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
    </style>
</head>
<body>

<div id="home" class="page active">
    <header><h1 class="logo">أجر ريسبكت</h1></header>
    <div class="grid">
        <div class="nav-card" onclick="showPage('quran-page')"><i class="fas fa-book-quran" style="color: #fbbf24;"></i><h3>القرآن</h3></div>
        <div class="nav-card" onclick="showPage('zad-page')"><i class="fas fa-book-atlas" style="color: #a37cf0;"></i><h3>زاد المسلم</h3></div>
        <div class="nav-card" onclick="showPage('quiz-page')"><i class="fas fa-trophy" style="color: #f87171;"></i><h3>التحديات</h3></div>
        <div class="nav-card" onclick="location.reload()"><i class="fas fa-sync" style="color: #60a5fa;"></i><h3>تحديث</h3></div>
    </div>
</div>

<div id="quran-page" class="page">
    <button class="btn-back" onclick="showPage('home')">العودة للرئيسية</button>
    <div style="width: 100%; max-width: 800px; margin: auto; overflow: hidden;">
        <iframe id="quran-frame" src="https://quran.com/ar"></iframe>
    </div>
</div>

<div id="zad-page" class="page">
    <button class="btn-back" onclick="showPage('home')">العودة للرئيسية</button>
    <h2 style="margin-bottom: 20px; color: var(--accent);">زاد المسلم (150 معلومة)</h2>
    <div id="zad-container"></div>
</div>

<div id="quiz-page" class="page">
    <button class="btn-back" onclick="showPage('home')">العودة للرئيسية</button>
    <div class="zad-card" style="border-right: none; text-align: center;">
        <h3 id="question-text">جاري تحميل السؤال...</h3>
        <div id="options"></div>
        <p id="feedback" style="margin-top: 15px; font-weight: bold;"></p>
    </div>
</div>

<script>
    // التنقل
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'zad-page') loadZad();
        if(id === 'quiz-page') loadQuestion();
    }

    // إصلاح زاد المسلم
    function loadZad() {
        const container = document.getElementById('zad-container');
        container.innerHTML = "";
        const facts = [
            "الصلاة عماد الدين من أقامها فقد أقام الدين.",
            "بر الوالدين من أعظم القربات إلى الله بعد الصلاة.",
            "من قرأ آية الكرسي دبر كل صلاة لم يمنعه من دخول الجنة إلا الموت.",
            "كلمتان خفيفتان على اللسان ثقيلتان في الميزان: سبحان الله وبحمده سبحان الله العظيم."
        ];
        // توليد 150 معلومة (تكرار للنموذج)
        for(let i=1; i<=150; i++) {
            let text = facts[i % facts.length];
            container.innerHTML += `
                <div class="zad-card">
                    <h4>المعلومة #${i}</h4>
                    <p>${text}</p>
                </div>`;
        }
    }

    // إصلاح التحديات (منع التعديل والتحويل التلقائي)
    const questions = [
        { q: "من هو النبي الملقب بأبو الأنبياء؟", o: ["إبراهيم", "موسى", "عيسى"], c: 0 },
        { q: "ما هي أطول سورة في القرآن الكريم؟", o: ["آل عمران", "البقرة", "النساء"], c: 1 },
        { q: "كم عدد أجزاء القرآن الكريم؟", o: ["30 جزء", "60 جزء", "114 جزء"], c: 0 }
    ];
    let currentQ = 0;

    function loadQuestion() {
        const q = questions[currentQ];
        document.getElementById('question-text').innerText = q.q;
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        document.getElementById('feedback').innerText = "";

        q.o.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i, q.c, btn);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selected, correct, btn) {
        const btns = document.querySelectorAll('.option-btn');
        // قفل جميع الأزرار لمنع التعديل
        btns.forEach(b => b.classList.add('disabled'));

        const feedback = document.getElementById('feedback');

        if(selected === correct) {
            btn.classList.add('correct');
            feedback.innerText = "إجابة صحيحة! ✨";
            feedback.style.color = "#2ecc71";
        } else {
            btn.classList.add('wrong');
            btns[correct].classList.add('correct'); // إظهار الصح
            feedback.innerText = "إجابة خاطئة ❌";
            feedback.style.color = "#e74c3c";
        }

        // الانتقال التلقائي بعد ثانية واحدة
        setTimeout(() => {
            currentQ = (currentQ + 1) % questions.length;
            loadQuestion();
        }, 1500);
    }
</script>
</body>
</html>
