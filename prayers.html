<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مواقيت الصلاة | Ajar Respect</title>
    <style>
        :root { --bg: #05040a; --gold: #c5a059; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 450px; margin: 50px auto; background: rgba(26, 20, 45, 0.7); padding: 30px; border: 1px solid var(--gold); backdrop-filter: blur(10px); }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid var(--gold); color: white; text-align: center; }
        button { width: 100%; padding: 15px; background: var(--gold); color: black; font-weight: bold; cursor: pointer; border: none; }
        .prayer-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid rgba(197,160,89,0.2); font-size: 1.2em; }
        .prayer-name { color: var(--gold); }
    </style>
</head>
<body>
    <a href="index.html" style="color: var(--gold); text-decoration: none;">← العودة للرئيسية</a>
    <div class="container">
        <h1 style="color: var(--gold)">🕌 مواقيت الصلاة</h1>
        <input type="text" id="countryInput" value="Saudi Arabia">
        <input type="text" id="cityInput" value="Riyadh">
        <button onclick="getPrayers()">تحديث المواقيت</button>
        <div id="results" style="margin-top: 20px;">
            <div class="prayer-row"><span class="prayer-name">الفجر</span><span id="fajr">-</span></div>
            <div class="prayer-row"><span class="prayer-name">الظهر</span><span id="dhuhr">-</span></div>
            <div class="prayer-row"><span class="prayer-name">العصر</span><span id="asr">-</span></div>
            <div class="prayer-row"><span class="prayer-name">المغرب</span><span id="maghrib">-</span></div>
            <div class="prayer-row"><span class="prayer-name">العشاء</span><span id="isha">-</span></div>
        </div>
    </div>
    <script>
        async function getPrayers() {
            const city = document.getElementById('cityInput').value;
            const country = document.getElementById('countryInput').value;
            try {
                const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=${country}&method=4`);
                const data = await response.json();
                if(data.code === 200) {
                    const t = data.data.timings;
                    document.getElementById('fajr').innerText = t.Fajr;
                    document.getElementById('dhuhr').innerText = t.Dhuhr;
                    document.getElementById('asr').innerText = t.Asr;
                    document.getElementById('maghrib').innerText = t.Maghrib;
                    document.getElementById('isha').innerText = t.Isha;
                }
            } catch (e) { console.log(e); }
        }
        window.onload = getPrayers;
    </script>
</body>
</html>
