<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواقيت الصلاة | Ajar Respect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Reem+Kufi:wght@400;700&display=swap');

        :root {
            --gold: #c5a059;
            --dark-bg: #0d0d1a; /* لون الخلفية الداكن ليتناسب مع صورك */
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Reem Kufi', sans-serif;
            min-height: 100vh;
        }

        /* الهيدر العلوي - نفس تصميم صفحة القرآن */
        header {
            background-color: #161625;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 22px;
            margin: 0;
            color: var(--gold);
        }

        .back-link {
            text-decoration: none;
            color: var(--gold);
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* حاوية المواقيت لتملأ الشاشة */
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .location-box {
            background: var(--glass);
            border: 1px solid var(--gold);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }

        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1a1a2e;
            border: 1px solid var(--gold);
            color: white;
            border-radius: 8px;
            font-family: inherit;
        }

        .update-btn {
            width: 100%;
            padding: 15px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* قائمة المواقيت */
        .prayer-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .prayer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            font-size: 18px;
        }

        .prayer-item:last-child {
            border-bottom: none;
        }

        .prayer-name {
            color: var(--gold);
            font-weight: bold;
        }

        .prayer-time {
            font-family: sans-serif; /* لسهولة قراءة الأرقام */
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-link">
             عودة <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1>مواقيت الصلاة</h1>
        <div style="width: 50px;"></div> </header>

    <div class="container">
        <div class="location-box">
            <i class="fa-solid fa-location-dot" style="color: var(--gold); font-size: 24px;"></i>
            <p id="city-display" style="margin: 10px 0;">السعودية - الرياض</p>
            <button class="update-btn" onclick="fetchPrayerTimes()">تحديث المواقيت</button>
        </div>

        <div class="prayer-list">
            <div class="prayer-item">
                <span class="prayer-name">الفجر</span>
                <span class="prayer-time" id="fajr">--:--</span>
            </div>
            <div class="prayer-item">
                <span class="prayer-name">الظهر</span>
                <span class="prayer-time" id="dhuhr">--:--</span>
            </div>
            <div class="prayer-item">
                <span class="prayer-name">العصر</span>
                <span class="prayer-time" id="asr">--:--</span>
            </div>
            <div class="prayer-item">
                <span class="prayer-name">المغرب</span>
                <span class="prayer-time" id="maghrib">--:--</span>
            </div>
            <div class="prayer-item">
                <span class="prayer-name">العشاء</span>
                <span class="prayer-time" id="isha">--:--</span>
            </div>
        </div>
    </div>

    <script>
        // استخدام الأوقات التي زودتني بها سابقاً كمثال افتراضي
        const manualTimes = {
            Fajr: "05:33",
            Dhuhr: "12:35",
            Asr: "15:53",
            Maghrib: "18:20",
            Isha: "19:50"
        };

        function fetchPrayerTimes() {
            // هنا نضع الأوقات في أماكنها
            document.getElementById('fajr').innerText = manualTimes.Fajr;
            document.getElementById('dhuhr').innerText = manualTimes.Dhuhr;
            document.getElementById('asr').innerText = manualTimes.Asr;
            document.getElementById('maghrib').innerText = manualTimes.Maghrib;
            document.getElementById('isha').innerText = manualTimes.Isha;
        }

        // تشغيل التحديث عند فتح الصفحة
        window.onload = fetchPrayerTimes;
    </script>
</body>
</html>
