<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواقيت الصلاة | Ajar Respect</title>
    <style>
        :root { --bg: #0f0a1e; --card: #1a142d; --accent: #a37cf0; }
        
        /* جعل الخلفية تمتد لملأ كامل الشاشة */
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', Tahoma; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* تنسيق زر العودة العلوي */
        .back-nav {
            padding: 20px;
            text-align: right;
        }
        .back-nav a {
            color: var(--accent);
            text-decoration: none;
            font-size: 16px;
        }

        /* تعديل الحاوية لتمتد بعرض الشاشة وطولها */
        .container { 
            flex-grow: 1; /* تمتد لتأخذ باقي مساحة الشاشة */
            width: 100%; 
            margin: 0; 
            background: var(--card); 
            padding: 25px; 
            box-sizing: border-box;
            border: none; /* إزالة الحدود لتندمج مع الشاشة */
            box-shadow: none;
            border-radius: 0; /* إزالة الانحناءات لتملأ الزوايا */
        }

        h1 { text-align: center; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--accent); background: #0f0a1e; color: white; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--accent); border: none; color: white; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .prayer-row { display: flex; justify-content: space-between; padding: 20px 15px; border-bottom: 1px solid #332a4d; font-size: 1.2em; }
        .prayer-row:last-child { border-bottom: none; }
        .prayer-name { color: var(--accent); }
        .status { margin-top: 20px; font-size: 0.9em; color: #888; text-align: center; }
    </style>
</head>
<body>
    <div class="back-nav">
        <a href="index.html">← العودة للرئيسية</a>
    </div>
    
    <div class="container">
        <h1>🕌 مواقيت الصلاة</h1>
        
        <input type="text" id="countryInput" placeholder="اكتب الدولة (مثلاً: Saudi Arabia)" value="Saudi Arabia">
        <input type="text" id="cityInput" placeholder="اكتب المدينة (مثلاً: Riyadh)" value="Riyadh">
        
        <button onclick="getPrayers()">عرض الأوقات</button>

        <div id="results" style="margin-top: 20px;">
            <div class="prayer-row"><span class="prayer-name">الفجر</span><span id="fajr">-</span></div>
            <div class="prayer-row"><span class="prayer-name">الظهر</span><span id="dhuhr">-</span></div>
            <div class="prayer-row"><span class="prayer-name">العصر</span><span id="asr">-</span></div>
            <div class="prayer-row"><span class="prayer-name">المغرب</span><span id="maghrib">-</span></div>
            <div class="prayer-row"><span class="prayer-name">العشاء</span><span id="isha">-</span></div>
        </div>
        
        <p id="loadingStatus" class="status">يرجى كتابة الدولة والمدينة بالإنجليزية لضمان الدقة</p>
    </div>

    <script>
        async function getPrayers() {
            const city = document.getElementById('cityInput').value;
            const country = document.getElementById('countryInput').value;
            const status = document.getElementById('loadingStatus');
            
            if(!city || !country) {
                alert("يرجى إدخال المدينة والدولة");
                return;
            }

            status.innerText = "جاري جلب الأوقات...";
            
            try {
                const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=${country}&method=4`);
                const data = await response.json();
                
                if(data.code === 200) {
                    const t = data.data.timings;
                    document.getElementById('fajr').innerText = t.Fajr;
                    document.getElementById('dhuhr').innerText = t.Dhuhr;
                    document.getElementById('asr').innerText = t.Asr;
                    document.getElementById('maghrib').innerText = t.Maghrib;
                    document.getElementById('isha').innerText = t.Isha;
                    status.innerText = `مواقيت الصلاة لمدينة ${city} اليوم`;
                } else {
                    status.innerText = "تعذر العثور على المدينة، يرجى التأكد من الكتابة بالإنجليزية";
                }
            } catch (error) {
                status.innerText = "خطأ في الاتصال بالخدمة";
            }
        }

        window.onload = getPrayers;
    </script>
</body>
</html>
