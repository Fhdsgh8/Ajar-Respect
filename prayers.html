<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مواقيت الصلاة | AJAR RESPECT</title>
    <style>
        body { background: #05040a; color: white; font-family: 'Segoe UI'; text-align: center; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .prayer-card { background: rgba(197, 160, 89, 0.05); border: 1px solid #c5a059; padding: 50px; border-radius: 20px; width: 350px; }
        .time-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid rgba(197, 160, 89, 0.1); }
        .prayer-name { color: #c5a059; font-weight: bold; }
        .prayer-time { font-family: 'monospace'; font-size: 20px; }
    </style>
</head>
<body>
    <div class="prayer-card">
        <h2 style="color:#f3cf8a">مواقيت الصلاة</h2>
        <div class="time-row"><span class="prayer-name">الفجر</span><span class="prayer-time">04:50 AM</span></div>
        <div class="time-row"><span class="prayer-name">الظهر</span><span class="prayer-time">12:15 PM</span></div>
        <div class="time-row"><span class="prayer-name">العصر</span><span class="prayer-time">03:30 PM</span></div>
        <div class="time-row"><span class="prayer-name">المغرب</span><span class="prayer-time">06:10 PM</span></div>
        <div class="time-row"><span class="prayer-name">العشاء</span><span class="prayer-time">07:40 PM</span></div>
    </div>
</body>
</html>
