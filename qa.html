<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سؤال وجواب | Ajar Respect</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap');
        :root { --bg: #05040a; --gold: #c5a059; }
        body { background: var(--bg); color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .qa-container { background: rgba(26, 20, 45, 0.7); max-width: 600px; margin: 30px auto; padding: 40px; border: 1px solid var(--gold); backdrop-filter: blur(10px); }
        .option-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: transparent; color: white; border: 1px solid var(--gold); cursor: pointer; font-size: 18px; transition: 0.3s; }
        .option-btn:hover { background: var(--gold); color: black; }
        h1 { font-family: 'Amiri'; color: var(--gold); font-size: 35px; }
    </style>
</head>
<body>
    <a href="index.html" style="color: var(--gold); text-decoration: none;">← العودة</a>
    <div class="qa-container">
        <h1>اختبر معلوماتك الدينية</h1>
        <div style="color: var(--gold); margin-bottom: 10px;">السؤال: <span id="q-num">1</span> / 120</div>
        <h2 id="question-text" style="font-family: 'Amiri';">جاري التحميل...</h2>
        <div id="options-container"></div>
        <div id="feedback" style="margin-top: 20px; font-weight: bold;"></div>
    </div>
    <script>
        const quizData = [
            { q: "من هو النبي الذي لُقب بـ 'أبو الأنبياء'؟", o: ["نوح", "إبراهيم", "آدم"], c: 1 },
            { q: "ما هي السورة التي تسمى 'عروس القرآن'؟", o: ["يس", "الرحمن", "البقرة"], c: 1 },
            { q: "كم عدد أجزاء القرآن الكريم؟", o: ["30", "60", "114"], c: 0 },
            { q: "من هو أول من أسلم من الرجال؟", o: ["عمر بن الخطاب", "علي بن أبي طالب", "أبو بكر الصديق"], c: 2 }
        ];
        let currentIdx = 0; let score = 0;
        function loadQuestion() {
            const q = quizData[currentIdx % quizData.length];
            document.getElementById('q-num').innerText = currentIdx + 1;
            document.getElementById('question-text').innerText = q.q;
            const container = document.getElementById('options-container');
            container.innerHTML = ""; document.getElementById('feedback').innerText = "";
            q.o.forEach((opt, i) => {
                const btn = document.createElement('button'); btn.className = 'option-btn';
                btn.innerText = opt; btn.onclick = () => check(i, q.c); container.appendChild(btn);
            });
        }
        function check(sel, cor) {
            const f = document.getElementById('feedback');
            if(sel === cor) { f.innerText = "إجابة صحيحة! ✨"; f.style.color = "#4CAF50"; score++; }
            else { f.innerText = "إجابة خاطئة ❌"; f.style.color = "#f44336"; }
            setTimeout(() => { currentIdx++; if(currentIdx < 120) loadQuestion(); else alert("انتهى الاختبار! نتيجتك: " + score); }, 1500);
        }
        loadQuestion();
    </script>
</body>
</html>
