<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي المعلومات | Ajar Respect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Reem+Kufi:wght@400;700&display=swap');
        
        :root { --bg: #05040a; --gold: #c5a059; --card-bg: #110c22; }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Reem Kufi', sans-serif; 
            margin: 0; 
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* جعل الحاوية تشغل كامل العرض */
        .qa-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .header-nav {
            width: 100%;
            padding: 20px;
            text-align: right;
        }

        .back-link { color: var(--gold); text-decoration: none; font-size: 18px; }

        h1 { font-family: 'Amiri'; color: var(--gold); font-size: 32px; margin: 10px 0; }

        .score-board { color: var(--gold); opacity: 0.8; margin-bottom: 30px; }

        /* تعديل منطقة السؤال لتملأ الشاشة */
        .question-box {
            width: 100%;
            max-width: 800px; /* لراحة القراءة في الشاشات الكبيرة */
            text-align: center;
        }

        #question-text {
            font-family: 'Amiri';
            font-size: 28px;
            line-height: 1.6;
            margin-bottom: 40px;
            min-height: 80px;
        }

        .options-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            width: 100%;
            padding: 20px;
            background: var(--card-bg);
            color: white;
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 12px;
            font-size: 20px;
            font-family: 'Reem Kufi';
            cursor: pointer;
            transition: 0.3s all ease;
        }

        .option-btn:active { transform: scale(0.98); background: var(--gold); color: black; }

        #feedback {
            margin-top: 30px;
            font-size: 22px;
            font-weight: bold;
            height: 30px;
        }
    </style>
</head>
<body>

    <div class="qa-wrapper">
        <div class="header-nav">
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-right"></i> عودة</a>
        </div>

        <h1>اختبر معلوماتك الدينية</h1>
        <div class="score-board">السؤال الحالي: <span id="q-num">1</span> / 120</div>

        <div class="question-box">
            <h2 id="question-text">جاري تحميل السؤال...</h2>
            <div id="options-container" class="options-list"></div>
            <div id="feedback"></div>
        </div>
    </div>

    <script>
        const quizData = [
            { q: "من هو النبي الذي لُقب بـ 'أبو الأنبياء'؟", o: ["نوح", "إبراهيم", "آدم"], c: 1 },
            { q: "ما هي السورة التي تسمى 'عروس القرآن'؟", o: ["يس", "الرحمن", "البقرة"], c: 1 },
            { q: "كم عدد أجزاء القرآن الكريم؟", o: ["30", "60", "114"], c: 0 },
            { q: "من هو أول من أسلم من الرجال؟", o: ["عمر بن الخطاب", "علي بن أبي طالب", "أبو بكر الصديق"], c: 2 },
            { q: "ما هي أطول سورة في القرآن الكريم؟", o: ["النساء", "البقرة", "آل عمران"], c: 1 }
            // يمكنك تكرار الأسئلة هنا حتى 120
        ];

        let currentIdx = 0;
        let score = 0;

        function loadQuestion() {
            const q = quizData[currentIdx % quizData.length];
            document.getElementById('q-num').innerText = currentIdx + 1;
            document.getElementById('question-text').innerText = q.q;
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            document.getElementById('feedback').innerText = "";

            q.o.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(i, q.c);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            const f = document.getElementById('feedback');
            const btns = document.querySelectorAll('.option-btn');
            
            // قفل الأزرار بعد الإجابة
            btns.forEach(b => b.disabled = true);

            if(selected === correct) {
                f.innerText = "أحسنت! إجابة صحيحة ✨";
                f.style.color = "#4CAF50";
                score++;
            } else {
                f.innerText = "إجابة خاطئة ❌";
                f.style.color = "#f44336";
            }

            setTimeout(() => {
                currentIdx++;
                if(currentIdx < 120) {
                    loadQuestion();
                } else {
                    document.querySelector('.question-box').innerHTML = `
                        <h2 style='color:var(--gold)'>انتهى التحدي!</h2>
                        <p style='font-size:24px'>درجتك النهائية: ${score} من 120</p>
                        <button onclick="location.reload()" class="option-btn" style="margin-top:20px">إعادة المحاولة</button>
                    `;
                }
            }, 1500);
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
